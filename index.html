<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>khanz — bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b0e;
    --panel: rgba(20,21,26,0.55);
    --panel-border: rgba(255,255,255,0.08);
    --panel-strong: rgba(15,16,20,0.72);
    --text: #f3f3f5;
    --text-dim: #9a9aa3;
    --text-faint: #6b6b74;
    --accent: #7dd3a8;
    --music-accent: #8fd6b0;
    --music-accent-soft: #c9b79d;
    --radius: 18px;
    --radius-sm: 12px;
  }

*{ box-sizing: border-box; margin:0; padding:0; }
html,body{ height:100%; }

body{
font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
color: var(--text);
background: #05060a;
min-height: 100vh;
overflow-x: hidden;
}

.bg{
position: fixed; inset: 0; z-index: 0;
background:
radial-gradient(1200px 700px at 78% 38%, rgba(255,150,90,0.10), transparent 60%),
linear-gradient(180deg, #0c1320 0%, #090c14 45%, #05060a 100%);
}
.bg::after{
content: "BACKGROUND — thay ảnh sau";
position; right: 6%; bottom: 4%;
font-size: 12px; letter-spacing: .04em;
color: rgba(255,255,255,0.18); font-weight:600;
}

.scrim-left{
position: fixed; inset: 0; z-index: 1;
background: linear-gradient(90deg,
rgba(5,6,10,0.92) 0%, rgba(5,6,10,0.86) 30%,
rgba(5,6,10,0.35) 48%, rgba(5,6,10,0) 60%);
pointer-events: none;
}

.page{
position: relative; z-index: 2; min-height: 100vh;
padding: 40px clamp(24px, 5vw, 64px);
display: flex; flex-direction: column;
}

nav{ display; align-items; gap: 40px; flex-wrap: wrap; row-gap: 14px; }
nav a{
color: var(--text-dim); text-decoration; font-size: 13px;
font-weight: 600; letter-spacing: .03em; position: relative;
padding-bottom: 10px; transition: color .2s ease;
}
nav a{ color: var(--text); }
nav a.active{ color: var(--text); }
nav a.active::after{
content:""; position; left:0; bottom:0;
width: 16px; height: 2px; background: var(--text); border-radius: 2px;
}

.clock-pill{
margin-left; display; align-items; gap:8px;
background: var(--panel); border: 1px solid var(--panel-border);
backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
padding: 10px 16px; border-radius: 999px;
