<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>khanz — bio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0a0b0e;
    --panel: rgba(20,21,26,0.55);
    --panel-border: rgba(255,255,255,0.08);
    --panel-strong: rgba(15,16,20,0.72);
    --text: #f3f3f5;
    --text-dim: #9a9aa3;
    --text-faint: #6b6b74;
    --accent: #7dd3a8;
    --radius: 18px;
    --radius-sm: 12px;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ height:100%; }

  body{
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--text);
    background: #05060a;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .bg{
    position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(1200px 700px at 78% 38%, rgba(255,150,90,0.10), transparent 60%),
      linear-gradient(180deg, #0c1320 0%, #090c14 45%, #05060a 100%);
  }
  .bg::after{
    content: "BACKGROUND — thay ảnh sau";
    position:absolute; right: 6%; bottom: 4%;
    font-size: 12px; letter-spacing: .04em;
    color: rgba(255,255,255,0.18); font-weight:600;
  }

  .scrim-left{
    position: fixed; inset: 0; z-index: 1;
    background: linear-gradient(90deg,
      rgba(5,6,10,0.92) 0%, rgba(5,6,10,0.86) 30%,
      rgba(5,6,10,0.35) 48%, rgba(5,6,10,0) 60%);
    pointer-events: none;
  }

  .page{
    position: relative; z-index: 2; min-height: 100vh;
    padding: 40px clamp(24px, 5vw, 64px);
    display: flex; flex-direction: column;
  }

  nav{ display:flex; align-items:center; gap: 40px; flex-wrap: wrap; row-gap: 14px; }
  nav a{
    color: var(--text-dim); text-decoration:none; font-size: 13px;
    font-weight: 600; letter-spacing: .03em; position: relative;
    padding-bottom: 10px; transition: color .2s ease;
  }
  nav a:hover{ color: var(--text); }
  nav a.active{ color: var(--text); }
  nav a.active::after{
    content:""; position:absolute; left:0; bottom:0;
    width: 16px; height: 2px; background: var(--text); border-radius: 2px;
  }

  .clock-pill{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 10px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--text);
  }
  .clock-pill svg{ width:14px; height:14px; opacity:.75; }

  .content{
    margin-top: auto; padding-top: 60px; max-width: 560px;
    display:flex; flex-direction:column; gap: 22px;
  }

  .status{ display:flex; align-items:center; gap:8px; font-size: 13px; color: var(--text-dim); font-weight: 600; }
  .status .dot{
    --status-rgb: 125,211,168;
    width:7px; height:7px; border-radius:50%;
    background: rgb(var(--status-rgb));
    animation: statusPulse 2.4s ease-out infinite;
  }
  @keyframes statusPulse{
    0%   { box-shadow: 0 0 0 0 rgba(var(--status-rgb), 0.55); }
    70%  { box-shadow: 0 0 0 9px rgba(var(--status-rgb), 0); }
    100% { box-shadow: 0 0 0 0 rgba(var(--status-rgb), 0); }
  }

  /* Badge hoạt động (đang chơi game / đang nghe nhạc / custom status) —
     nằm ngay dưới @handle, kế bên avatar. Bấm vào để mở rộng xem chi tiết
     (khi có hoạt động thật, ví dụ đang chơi game) — xem .activity-detail. */
  .activity-wrap{ display:flex; flex-direction:column; }

  .activity-line{
    display:none; align-items:center; gap:8px;
    font-size: 12.5px; color: var(--text); font-weight: 600;
    margin-top: 8px;
    width: fit-content; max-width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--panel-border);
    padding: 5px 12px 5px 5px;
    border-radius: 999px;
    transition: background .18s ease, border-color .18s ease;
  }
  .activity-line.clickable{ cursor: pointer; }
  .activity-line.clickable:hover{ background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.16); }
  .activity-line img{
    width: 20px; height: 20px; border-radius: 6px; flex-shrink:0;
    object-fit: cover; background: rgba(255,255,255,0.08);
  }
  .activity-line svg{ width:15px; height:15px; flex-shrink:0; opacity:.9; color: var(--accent); }
  .activity-line span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .activity-line span b{ font-weight:700; }
  .activity-line .chevron{
    width:11px; height:11px; opacity:.55; margin-left:2px; flex-shrink:0;
    transition: transform .2s ease;
  }
  .activity-line.open .chevron{ transform: rotate(180deg); }

  /* Panel chi tiết — thu gọn bằng max-height/opacity nên có hiệu ứng mở rộng mượt */
  .activity-detail{
    max-height: 0; opacity: 0; overflow: hidden;
    width: fit-content; max-width: 340px;
    margin-top: 0;
    background: var(--panel-strong); border: 1px solid var(--panel-border);
    border-radius: var(--radius-sm);
    transition: max-height .32s ease, opacity .25s ease, margin-top .32s ease;
  }
  .activity-detail.open{ max-height: 240px; opacity: 1; margin-top: 8px; }
  .activity-detail-inner{ display:flex; gap:12px; padding: 12px 14px; }
  .activity-detail-inner img{
    width: 54px; height: 54px; border-radius: 12px; flex-shrink:0;
    object-fit: cover; background: rgba(255,255,255,0.08);
  }
  .activity-detail-text{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .activity-detail-name{ font-size: 13.5px; font-weight: 700; }
  .activity-detail-line{
    font-size: 12px; color: var(--text-dim); font-weight: 600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .activity-detail-time{ font-size: 11px; color: var(--text-faint); font-weight:600; margin-top: 4px; }

  .identity{ display:flex; align-items:flex-start; gap: 22px; }

  .avatar-wrap{ position: relative; width: 88px; height: 88px; flex-shrink:0; }

  .avatar{
    --status-rgb: 125,211,168;
    width: 88px; height: 88px; border-radius: 50%; flex-shrink:0;
    background: linear-gradient(145deg, #2a2d38, #17181e);
    background-size: cover; background-position: center;
    border: 1px solid var(--panel-border);
    display:flex; align-items:center; justify-content:center;
    font-size: 10px; font-weight:700; letter-spacing:.03em;
    color: rgba(255,255,255,0.28); text-align:center; line-height:1.4; padding: 6px;
    white-space: pre-line;
    transition: background-image .35s ease;
    animation: cloudGlow 6s ease-in-out infinite;
  }

  /* Quầng sáng mềm quanh avatar, nhiều lớp mờ chồng lên nhau như đám mây
     thay vì một vòng viền cứng — màu lấy theo trạng thái Discord (--status-rgb). */
  @keyframes cloudGlow{
    0%, 100% {
      box-shadow:
        0 0 16px 3px  rgba(var(--status-rgb), 0.30),
        0 0 34px 12px rgba(var(--status-rgb), 0.16),
        0 0 56px 22px rgba(var(--status-rgb), 0.08);
    }
    50% {
      box-shadow:
        0 0 22px 6px  rgba(var(--status-rgb), 0.40),
        0 0 44px 16px rgba(var(--status-rgb), 0.20),
        0 0 68px 28px rgba(var(--status-rgb), 0.10);
    }
  }

  @media (prefers-reduced-motion: reduce){
    .avatar{ animation: none; box-shadow: 0 0 24px 8px rgba(var(--status-rgb), 0.22); }
  }

  /* Lớp phủ viền trang trí Discord (avatar decoration / Nitro frame).
     Ảnh trang trí của Discord vốn được thiết kế lớn hơn avatar một chút
     nên cần phóng to ra ngoài viền avatar để khớp đúng tỉ lệ gốc. */
  .avatar-deco{
    position: absolute; inset: -15%;
    background-size: contain; background-position: center; background-repeat: no-repeat;
    pointer-events: none;
    display: none;
  }
  .avatar-deco.show{ display: block; }

  .id-text{ min-width: 0; }
  .id-text h1{ font-size: 34px; font-weight: 800; letter-spacing: -0.02em; line-height:1.1; }
  .id-text .handle{ margin-top: 6px; font-size: 14px; color: var(--text-dim); font-weight: 600; }

  .bio-text{ font-size: 14.5px; line-height: 1.65; color: var(--text-dim); max-width: 400px; }

  .tags{ display:flex; gap:10px; flex-wrap:wrap; }
  .tag{
    padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--panel-border); font-size: 12.5px; font-weight: 600; color: var(--text);
  }

  .links{ display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; max-width: 500px; }
  .link-card{
    background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: var(--radius-sm); padding: 14px 14px 12px; text-decoration:none;
    color: var(--text); display:flex; flex-direction:column; justify-content:space-between;
    gap: 18px; transition: transform .18s ease, background .18s ease, border-color .18s ease;
    min-height: 78px;
  }
  .link-card:hover{ transform: translateY(-2px); background: rgba(30,31,38,0.7); border-color: rgba(255,255,255,0.16); }
  .link-card .top{ display:flex; align-items:center; justify-content:space-between; }
  .link-card svg.icon{ width:18px; height:18px; }
  .link-card svg.arrow{ width:12px; height:12px; opacity:.55; }
  .link-card .label{ font-size: 12.5px; font-weight: 600; }

  .player{
    background: var(--panel-strong); border: 1px solid var(--panel-border);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border-radius: var(--radius); padding: 16px 18px; max-width: 500px;
    display:flex; flex-direction:column; gap: 14px;
  }
  .player-top{ display:flex; align-items:center; gap: 14px; }
  .player-art{
    width: 46px; height: 46px; border-radius: 10px;
    background: linear-gradient(160deg,#2b2f3a,#121319);
    background-size: cover; background-position: center; flex-shrink:0;
  }
  .player-info{ flex:1; min-width:0; cursor: default; }
  .player-listening{ display:flex; align-items:center; gap:6px; font-size: 11.5px; color: var(--text-dim); font-weight:600; margin-bottom: 3px; }
  .player-listening .dot{ width:6px;height:6px;border-radius:50%; background: var(--accent); }
  .player-title{ font-size: 15px; font-weight: 700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .player-artist{ font-size: 12.5px; color: var(--text-dim); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .player-actions{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .icon-btn{
    width: 34px; height:34px; border-radius:50%; background: rgba(255,255,255,0.06);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    text-decoration:none; border:none; cursor:pointer; color: var(--text);
    transition: background .18s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.12); }
  .icon-btn svg{ width:15px; height:15px; }
  .icon-btn.spotify svg{ width:16px; height:16px; color:#1ed760; }
  .icon-btn.list-open{ background: rgba(255,255,255,0.14); }

  .player-controls{ display:flex; align-items:center; gap: 18px; }
  .player-controls button{ background:none; border:none; cursor:pointer; color: var(--text); display:flex; align-items:center; justify-content:center; padding:0; }
  .player-controls svg{ width:16px; height:16px; }
  .player-controls .play-btn{ width: 30px; height:30px; background: var(--text); border-radius:50%; color: #0a0a0a; }
  .player-controls .play-btn svg{ width:13px; height:13px; }

  .progress-row{ display:flex; align-items:center; gap:10px; font-size: 11px; color: var(--text-faint); font-weight:600; }
  .progress-track{ flex:1; height: 3px; border-radius: 3px; background: rgba(255,255,255,0.1); overflow:hidden; cursor:pointer; }
  .progress-fill{ width: 0%; height:100%; background: var(--text); border-radius:3px; transition: width .2s linear; }

  .playlist-panel{
    display:none; flex-direction:column; gap: 3px;
    max-height: 220px; overflow-y: auto;
    border-top: 1px solid var(--panel-border);
    padding-top: 10px; margin-top: 2px;
  }
  .playlist-panel.open{ display:flex; }
  .playlist-panel::-webkit-scrollbar{ width: 5px; }
  .playlist-panel::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.12); border-radius: 4px; }
  .playlist-item{
    display:flex; align-items:center; justify-content:space-between; gap: 10px;
    padding: 9px 10px; border-radius: 10px; cursor:pointer;
    font-size: 12.5px; font-weight:600; color: var(--text-dim);
    transition: background .15s ease, color .15s ease;
  }
  .playlist-item:hover{ background: rgba(255,255,255,0.05); color: var(--text); }
  .playlist-item.active{ background: rgba(255,255,255,0.09); color: var(--text); }
  .playlist-item .pi-name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .playlist-item .pi-name b{ font-weight:700; }
  .playlist-item .pi-dur{ flex-shrink:0; font-size: 11px; color: var(--text-faint); font-weight:600; }

  footer{ margin-top: 40px; font-size: 12px; color: var(--text-faint); font-weight: 600; }

  .weather{
    position: fixed; right: clamp(24px, 5vw, 64px); bottom: 40px; z-index: 3;
    display:flex; align-items:center; gap: 12px;
    background: var(--panel); border: 1px solid var(--panel-border);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    padding: 12px 18px; border-radius: var(--radius-sm);
  }
  .weather-pin{ width:30px; height:30px; border-radius:50%; background: rgba(255,255,255,0.06); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .weather-pin svg{ width:14px; height:14px; }
  .weather-loc{ font-size: 12.5px; font-weight:700; }
  .weather-sub{ font-size: 11px; color: var(--text-dim); margin-top:1px; }
  .weather-temp{ display:flex; align-items:center; gap:6px; margin-left: 6px; font-size: 13px; font-weight:700; white-space:nowrap; }
  .weather-temp svg{ width:15px; height:15px; opacity:.8; }

  @media (max-width: 900px){
    .links{ grid-template-columns: repeat(2,1fr); }
    .weather{ position: static; margin-top: 24px; width: fit-content; }
  }
  @media (max-width: 560px){
    .page{ padding: 24px 18px; }
    .identity{ flex-direction:column; align-items:flex-start; gap:14px; }
    .id-text h1{ font-size: 28px; }
    .content{ padding-top: 32px; gap: 18px; }
    .activity-line, .activity-detail{ max-width: 280px; }
  }
  @media (prefers-reduced-motion: reduce){ .link-card{ transition:none; } }
</style>
</head>
<body>

  <div class="bg"></div>
  <div class="scrim-left"></div>

  <div class="page">
    <nav id="nav"></nav>

    <div class="content">
      <div class="status" id="status"></div>
      <div class="identity" id="identity"></div>
      <p class="bio-text" id="bioText"></p>
      <div class="tags" id="tags"></div>
      <div class="links" id="links"></div>
      <div class="player" id="player"></div>
    </div>

    <footer id="footer"></footer>
  </div>

  <div class="weather" id="weather"></div>

<script>
/* =========================================================================
   BIO CONFIG — CHỈNH SỬA MỌI THỨ Ở ĐÂY, PHẦN CODE BÊN DƯỚI TỰ RENDER
   =========================================================================
   - Muốn thêm bài hát mới: thêm 1 object vào mảng music.tracks, chỉ cần
     3 trường gọn: title ("Tên bài - Ca sĩ"), cover (ảnh bìa), music (file
     nhạc thật — trình phát sẽ phát y như 1 music player thật, kéo được
     thanh tiến trình, thời lượng tự lấy từ file, không phải giả lập nữa).
   - Muốn đổi avatar / background: xem ghi chú ở avatar.image và phần .bg
     trong CSS (tìm class ".bg").
   - Muốn thêm link mạng xã hội mới: thêm object vào mảng "socials" và
     thêm icon SVG tương ứng vào ICONS.social bên dưới.
   - Thời tiết lấy TỰ ĐỘNG theo vị trí trình duyệt (Open-Meteo, miễn phí,
     không cần API key). Nếu người dùng từ chối chia sẻ vị trí, trang sẽ
     dùng toạ độ dự phòng trong weather.fallback.
   - Badge "Đang chơi / Đang nghe" cạnh avatar lấy tự động từ Discord thật
     qua Lanyard (xem phần discord bên dưới) — bấm vào badge để mở rộng
     xem chi tiết (ảnh lớn hơn, mô tả đầy đủ, đã chơi/nghe bao lâu).
   ========================================================================= */
const BIO_CONFIG = {

  nav: [
    { label: "HOME",     href: "#", active: true },
    { label: "PROJECTS", href: "#" },
    { label: "ABOUT",    href: "#" },
    { label: "CONTACT",  href: "#" },
  ],

  clock: { enabled: true, format24h: true },

  profile: {
    status: "Online",
    name: "khanz",
    handle: "@itsrealkhanz",
    bio: "Just a guy who loves creating, exploring new things and enjoying the little moments.",
    avatar: {
      image: null,                       // ví dụ: "https://example.com/avatar.jpg"
      fallbackText: "AVATAR\n(thay sau)" // hiện khi chưa có image
    },
    tags: ["Developer", "Designer", "Gamer"]
  },

  socials: [
    { key: "discord", name: "Discord",     url: "#" },
    { key: "github",  name: "GitHub",      url: "#" },
    { key: "youtube", name: "YouTube",     url: "#" },
    { key: "x",       name: "X (Twitter)", url: "#" },
    // Thêm mạng xã hội mới, ví dụ:
    // { key: "tiktok", name: "TikTok", url: "#" },  // nhớ thêm icon "tiktok" vào ICONS.social
  ],

  /* ---- NHẠC — gọn còn 3 trường mỗi bài, thêm bao nhiêu bài tuỳ thích ----
     title: "Tên bài hát - Ca sĩ"   (trình phát tự tách ra 2 dòng)
     cover: URL ảnh bìa hoặc tên file, ví dụ "cover.jpg"  (để null nếu chưa có)
     music: URL file nhạc hoặc tên file, ví dụ "song.mp3" / "song.mp4"
            — đây là file phát thật, không phải giả lập; thời lượng và
            thanh tiến trình tự lấy từ chính file này.                     */
  music: {
    startIndex: 0,      // bài phát mặc định khi mở trang (index trong mảng tracks)
    autoAdvance: true,  // hết bài thì tự chuyển bài kế
    tracks: [
      { title: "Good Days - SZA", cover: "https://image-cdn-ak.spotifycdn.com/image/ab67616d00001e02c540824e70b874f49dd9b32f", music: "#" },
      // thêm bài khác, ví dụ:
      // { title: "Kill Bill - SZA", cover: "https://.../kill-bill.jpg", music: "https://.../kill-bill.mp3" },
      // { title: "Snooze - SZA",    cover: "snooze.jpg",                 music: "snooze.mp4" },
    ]
  },

  /* ---- DISCORD — avatar + trạng thái "Online" tự cập nhật theo Discord thật ----
     Dùng dịch vụ miễn phí Lanyard (không cần token bot riêng).
     Cách lấy userId: bật Developer Mode trong Discord (Cài đặt > Nâng cao),
     bấm chuột phải vào avatar của bạn > "Copy User ID".
     LƯU Ý BẮT BUỘC: tài khoản Discord của bạn phải tham gia server Lanyard
     tại https://discord.gg/lanyard thì hệ thống mới đọc được trạng thái. */
  discord: {
    enabled: true,                // đã bật — dùng ID bạn cung cấp
    userId: "1473247060298961040",
    useAvatar: true,          // avatar tự lấy từ Discord
    useAvatarDecoration: true,// hiện khung trang trí (Nitro decoration) nếu có đang trang bị
    useIdentity: true,        // tên hiển thị (h1) + @handle tự lấy theo Discord (global name + username)
    useActivity: true,        // hiện badge "Đang chơi / Đang nghe / Đang xem" — bấm để xem chi tiết
    useStatus: true,          // chữ Online/Idle/... + viền màu trạng thái tự đổi theo Discord
    pollIntervalMs: 20000     // tần suất kiểm tra lại (mili giây)
  },

  /* ---- THỜI TIẾT THỰC TẾ ---- */
  weather: {
    useGeolocation: false,  // false = không xin quyền vị trí, luôn dùng toạ độ cố định bên dưới
    fallback: { location: "Vĩnh Long, Việt Nam", lat: 10.2537, lon: 105.9722 }
  },

  footer: { text: "© 2025 khanz. All rights reserved." }
};
/* ========================= HẾT PHẦN CONFIG ============================= */

/* ------------------------------ HELPERS ---------------------------------- */
const $ = (sel) => document.querySelector(sel);
const fmtTime = (s) => {
  if (!isFinite(s) || s < 0) s = 0;
  return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
};

// Tách "Tên bài - Ca sĩ" thành 2 phần để hiển thị 2 dòng như player cũ.
// Nếu không có " - " thì coi cả chuỗi là tên bài, ca sĩ để trống.
function parseTrackTitle(raw){
  const idx = raw.indexOf(' - ');
  if (idx === -1) return { songTitle: raw, artist: '' };
  return { songTitle: raw.slice(0, idx), artist: raw.slice(idx + 3) };
}

/* ------------------------------ RENDER NAV -------------------------------- */
function renderNav(){
  const { nav, clock } = BIO_CONFIG;
  const navEl = $('#nav');
  navEl.innerHTML = nav.map(item =>
    `<a href="${item.href}" class="${item.active ? 'active' : ''}">${item.label}</a>`
  ).join('');

  if (clock.enabled){
    const pill = document.createElement('div');
    pill.className = 'clock-pill';
    pill.innerHTML = `${ICONS.clock}<span id="clock">--:--</span>`;
    navEl.appendChild(pill);
    const updateClock = () => {
      const now = new Date();
      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2,'0');
      if (!clock.format24h){ h = ((h+11)%12)+1; }
      $('#clock').textContent = `${String(h).padStart(2,'0')}:${m}`;
    };
    updateClock();
    setInterval(updateClock, 30000);
  }
}

function renderProfile(){
  const { profile } = BIO_CONFIG;

  $('#status').innerHTML = `<span class="dot"></span><span>${profile.status}</span>`;

  const avatarStyle = profile.avatar.image

      <div class="avatar-deco" id="avatarDeco"></div>

    <div class="id-text">

/* ------------------------------- MUSIC PLAYER ------------------------------ */
/* Phát nhạc THẬT qua thẻ <audio> ẩn (đọc được cả .mp3 và file âm thanh
   trong .mp4) — không còn đếm giờ giả lập. Thời lượng bài hát tự lấy từ
   chính file nhạc khi tải xong metadata. */
const Player = {
  tracks: BIO_CONFIG.music.tracks.map(t => ({
    ...parseTrackTitle(t.title),
    cover: t.cover || null,
    music: t.music
  })),
  index: BIO_CONFIG.music.startIndex || 0,
  playing: false,
  audio: null,
  durations: {}, // index -> số giây, lấy từ file nhạc thật (lazy load)
  listOpen: false,

  currentTrack(){ return this.tracks[this.index]; },

  mount(){
    const el = $('#player');
    el.innerHTML = `
      <audio id="pAudio" preload="metadata"></audio>
      <div class="player-top">
        <div class="player-art" id="pArt"></div>
        <div class="player-info">
          <div class="player-listening"><span class="dot"></span>Listening to</div>
          <div class="player-title" id="pTitle"></div>
          <div class="player-artist" id="pArtist"></div>
        </div>
        <div class="player-actions">
          <button class="icon-btn" id="pListBtn" aria-label="Danh sách bài hát">${ICONS.list}</button>
          <a class="icon-btn spotify" id="pLink" href="#" target="_blank" rel="noopener">${ICONS.spotify}</a>
        </div>
      </div>
      <div class="progress-row">
        <span id="pElapsed">0:00</span>
        <div class="progress-track" id="pTrack"><div class="progress-fill" id="pFill"></div></div>
        <span id="pDuration">0:00</span>
      </div>
      <div class="player-controls">
        <button id="pPrev" aria-label="Previous">${ICONS.prev}</button>
        <button class="play-btn" id="pPlay" aria-label="Play/Pause">${ICONS.play}</button>
        <button id="pNext" aria-label="Next">${ICONS.next}</button>
      </div>
      <div class="playlist-panel" id="pList"></div>
    `;

    this.audio = $('#pAudio');

    this.audio.addEventListener('loadedmetadata', () => {
      this.durations[this.index] = this.audio.duration;
      $('#pDuration').textContent = fmtTime(this.audio.duration);
      this.renderList();
    });
    this.audio.addEventListener('timeupdate', () => {
      $('#pElapsed').textContent = fmtTime(this.audio.currentTime);
      this.updateFill();
    });
    this.audio.addEventListener('ended', () => {
      if (BIO_CONFIG.music.autoAdvance){ this.next(); }
      else { this.pause(); }
    });
    this.audio.addEventListener('play', () => { this.playing = true; $('#pPlay').innerHTML = ICONS.pause; });
    this.audio.addEventListener('pause', () => { this.playing = false; $('#pPlay').innerHTML = ICONS.play; });

    $('#pPrev').addEventListener('click', () => this.prev());
    $('#pNext').addEventListener('click', () => this.next());
    $('#pPlay').addEventListener('click', () => this.toggle());
    $('#pTrack').addEventListener('click', (e) => this.seek(e));
    $('#pListBtn').addEventListener('click', () => this.toggleList());

    this.loadTrack(this.index, false);
    this.renderList();
    this.preloadDurations();
  },

  loadTrack(i, autoplay){
    this.index = i;
    const t = this.currentTrack();
    if (!t) return;

    this.audio.pause();
    this.audio.src = t.music || '';
    this.audio.load();

    $('#pTitle').textContent = t.songTitle;
    $('#pArtist').textContent = t.artist;
    $('#pArt').style.backgroundImage = t.cover ? `url('${t.cover}')` : '';
    $('#pLink').href = t.music || '#';
    $('#pElapsed').textContent = '0:00';
    $('#pDuration').textContent = this.durations[i] ? fmtTime(this.durations[i]) : '0:00';
    $('#pFill').style.width = '0%';

    if (autoplay) this.play();
  },

  renderList(){
    $('#pList').innerHTML = this.tracks.map((t, i) => `
      <div class="playlist-item ${i === this.index ? 'active' : ''}" data-index="${i}">
        <span class="pi-name"><b>${t.songTitle}</b>${t.artist ? ' — ' + t.artist : ''}</span>
        <span class="pi-dur">${this.durations[i] ? fmtTime(this.durations[i]) : '--:--'}</span>
      </div>
    `).join('');

    $('#pList').querySelectorAll('.playlist-item').forEach(item => {
      item.addEventListener('click', () => {
        const i = Number(item.dataset.index);
        if (i === this.index){ this.toggle(); return; }
        this.loadTrack(i, true);
        this.renderList();
      });
    });
  },

  toggleList(){
    this.listOpen = !this.listOpen;
    $('#pList').classList.toggle('open', this.listOpen);
    $('#pListBtn').classList.toggle('list-open', this.listOpen);
  },

  updateFill(){
    const dur = this.audio.duration || this.durations[this.index] || 0;
    const pct = dur ? Math.min(100, (this.audio.currentTime / dur) * 100) : 0;
    $('#pFill').style.width = pct + '%';
  },

  toggle(){ this.playing ? this.pause() : this.play(); },

  play(){
    const p = this.audio.play();
    if (p && p.catch){ p.catch(() => { /* trình duyệt chặn autoplay hoặc thiếu file — giữ trạng thái tạm dừng */ }); }
  },

  pause(){ this.audio.pause(); },

  next(){ this.loadTrack((this.index + 1) % this.tracks.length, this.playing); this.renderList(); },
  prev(){ this.loadTrack((this.index - 1 + this.tracks.length) % this.tracks.length, this.playing); this.renderList(); },

  seek(e){
    const track = $('#pTrack');
    const rect = track.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const dur = this.audio.duration || this.durations[this.index] || 0;
    if (dur){ this.audio.currentTime = pct * dur; }
    this.updateFill();
  },

  // Lấy trước thời lượng của những bài chưa mở tới bằng 1 thẻ audio ẩn khác,
  // để danh sách phát hiện sẵn thời lượng thay vì để trống "--:--".
  preloadDurations(){
    this.tracks.forEach((t, i) => {
      if (i === this.index || this.durations[i] || !t.music) return;
      const probe = new Audio();
      probe.preload = 'metadata';
      probe.src = t.music;
      probe.addEventListener('loadedmetadata', () => {
        this.durations[i] = probe.duration;
        this.renderList();
      });
      probe.addEventListener('error', () => {}); // file lỗi/chưa có thì bỏ qua, giữ "--:--"
    });
  }
};

/* ------------------------------- WEATHER (API THẬT) ------------------------------ */
/* Dùng Open-Meteo (miễn phí, không cần API key, cho phép gọi trực tiếp từ trình duyệt).
   Docs: https://open-meteo.com/                                                     */
const Weather = {

  // Mã thời tiết WMO -> icon + nhãn tiếng Việt (rút gọn các mã phổ biến)
  codeMap(code){
    if (code === 0) return { icon: ICONS.sun, label: 'Trời quang' };
    if ([1,2].includes(code)) return { icon: ICONS.sun, label: 'Ít mây' };
    if (code === 3) return { icon: ICONS.cloud, label: 'Nhiều mây' };
    if ([45,48].includes(code)) return { icon: ICONS.cloud, label: 'Sương mù' };
    if ([51,53,55,56,57].includes(code)) return { icon: ICONS.rain, label: 'Mưa phùn' };
    if ([61,63,65,66,67,80,81,82].includes(code)) return { icon: ICONS.rain, label: 'Mưa' };
    if ([71,73,75,77,85,86].includes(code)) return { icon: ICONS.cloud, label: 'Có tuyết' };
    if ([95,96,99].includes(code)) return { icon: ICONS.rain, label: 'Dông' };
    return { icon: ICONS.cloud, label: 'Nhiều mây' };
  },

  renderLoading(){
    $('#weather').innerHTML = `
      <div class="weather-pin">${ICONS.pin}</div>
      <div>
        <div class="weather-loc">Đang xác định vị trí...</div>
        <div class="weather-sub">Đang tải thời tiết</div>
      </div>
    `;
  },

  renderData(locationName, tempC, code){
    const w = this.codeMap(code);
    $('#weather').innerHTML = `
      <div class="weather-pin">${ICONS.pin}</div>
      <div>
        <div class="weather-loc">${locationName}</div>
        <div class="weather-sub">${w.label}</div>
      </div>
      <div class="weather-temp">${w.icon}${Math.round(tempC)}°C</div>
    `;
  },

  renderError(){
    $('#weather').innerHTML = `
      <div class="weather-pin">${ICONS.pin}</div>
      <div>
        <div class="weather-loc">Không lấy được thời tiết</div>
        <div class="weather-sub">Vui lòng thử lại sau</div>
      </div>
    `;
  },

  async fetchWeather(lat, lon){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('weather fetch failed');
    const data = await res.json();
    return { tempC: data.current.temperature_2m, code: data.current.weather_code };
  },

  async reverseGeocode(lat, lon){
    try{
      const url = `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=vi`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('geocode failed');
      const data = await res.json();
      const city = data.city || data.locality || data.principalSubdivision;
      const country = data.countryName;
      return [city, country].filter(Boolean).join(', ');
    }catch(e){
      return null;
    }
  },

  lastLat: null,
  lastLon: null,
  lastName: null,

  async loadFor(lat, lon, knownName){
    this.lastLat = lat;
    this.lastLon = lon;
    try{
      const [weatherData, name] = await Promise.all([
        this.fetchWeather(lat, lon),
        knownName ? Promise.resolve(knownName) : this.reverseGeocode(lat, lon)
      ]);
      this.lastName = name || 'Vị trí của bạn';
      this.renderData(this.lastName, weatherData.tempC, weatherData.code);
    }catch(e){
      this.renderError();
    }
  },

  // Gọi lại API để cập nhật tình trạng (nắng/mưa/mây...) mà không phải xin
  // vị trí hay tra tên khu vực lại từ đầu.
  async refresh(){
    if (this.lastLat == null || this.lastLon == null) return;
    try{
      const weatherData = await this.fetchWeather(this.lastLat, this.lastLon);
      this.renderData(this.lastName, weatherData.tempC, weatherData.code);
    }catch(e){
      // giữ nguyên dữ liệu cũ trên UI nếu lần cập nhật này lỗi, thử lại ở chu kỳ sau
    }
  },

  init(){
    this.renderLoading();
    const { fallback } = BIO_CONFIG.weather;
    // Luôn dùng toạ độ cố định trong config — không xin quyền vị trí trình duyệt.
    this.loadFor(fallback.lat, fallback.lon, fallback.location);

    // Tự động cập nhật tình trạng thời tiết mỗi 10 phút (không load lại trang)
    setInterval(() => this.refresh(), 10 * 60 * 1000);
  }
};

/* ------------------------------- DISCORD (LANYARD) -------------------------------- */
/* Lấy avatar + trạng thái online/idle/dnd/offline thật từ Discord qua Lanyard API.
   Docs: https://github.com/Phineas/lanyard — miễn phí, không cần key,
   chỉ cần userId đã tham gia server Lanyard.                                        */
const Discord = {
  colors: {
    online:  { rgb: '35,165,90',   label: 'Online' },
    idle:    { rgb: '240,178,50',  label: 'Idle' },
    dnd:     { rgb: '242,63,67',   label: 'Do Not Disturb' },
    offline: { rgb: '128,132,142', label: 'Offline' }
  },

  // Nhãn tiếng Việt + icon riêng cho từng loại activity Discord trả về.
  // type: 0 Playing, 1 Streaming, 2 Listening, 3 Watching, 5 Competing.
  activityMeta: {
    0: { verb: 'Đang chơi',    icon: null }, // gán ICONS.game lúc init()
    1: { verb: 'Đang stream',  icon: null }, // ICONS.stream
    2: { verb: 'Đang nghe',    icon: null }, // ICONS.music_activity
    3: { verb: 'Đang xem',     icon: null }, // ICONS.eye
    5: { verb: 'Đang thi đấu', icon: null }, // ICONS.game
  },

  // Trạng thái mở/đóng của panel chi tiết + hoạt động đang được hiển thị,
  // lưu lại để giữ nguyên khi Lanyard cập nhật lại (poll mỗi vài giây).
  detailOpen: false,
  currentActivity: null,

  avatarUrl(user){
    if (!user) return null;
    if (!user.avatar){
      // avatar mặc định của Discord nếu người dùng chưa đặt avatar riêng
      const fallbackIndex = (Number(user.discriminator) || 0) % 5;
      return `https://cdn.discordapp.com/embed/avatars/${fallbackIndex}.png`;
    }
    const ext = user.avatar.startsWith('a_') ? 'gif' : 'png'; // avatar động dùng gif
    return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=128`;
  },

  // Viền trang trí (avatar decoration / Nitro frame) người dùng đang trang bị trên Discord.
  // Lanyard trả về null nếu tài khoản không gắn viền nào.
  decorationUrl(discordUser){
    const deco = discordUser && discordUser.avatar_decoration_data;
    if (!deco || !deco.asset) return null;
    return `https://cdn.discordapp.com/avatar-decoration-presets/${deco.asset}.png?size=160`;
  },

  // Ảnh nhỏ của game / app đang chạy (nếu Discord có gửi asset kèm activity),
  // dùng làm icon cho badge/panel chi tiết thay vì icon SVG chung.
  activityImageUrl(activity){
    const assets = activity && activity.assets;
    if (!assets || !assets.large_image) return null;
    const img = assets.large_image;
    if (img.startsWith('mp:')){
      return `https://media.discordapp.net/${img.replace('mp:', '')}`;
    }
    if (activity.application_id){
      return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${img}.png`;
    }
    return null;
  },

  // "5 phút", "2 giờ 10 phút", "3 ngày"... tính từ mốc timestamps.start Discord gửi
  timeSince(startMs){
    const diff = Math.max(0, Date.now() - startMs);
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return 'vài giây';
    if (mins < 60) return `${mins} phút`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs} giờ ${mins % 60} phút`;
    return `${Math.floor(hrs / 24)} ngày`;
  },

  applyAvatar(discordUser){
    const url = this.avatarUrl(discordUser);
    const avatarEl = document.querySelector('.avatar');
    if (avatarEl && url){
      avatarEl.style.backgroundImage = `url('${url}')`;
      avatarEl.textContent = '';
    }
  },

  applyDecoration(discordUser){
    const decoEl = document.querySelector('#avatarDeco');
    if (!decoEl) return;
    const url = this.decorationUrl(discordUser);
    if (url){
      decoEl.style.backgroundImage = `url('${url}')`;
      decoEl.classList.add('show');
    } else {
      decoEl.style.backgroundImage = '';
      decoEl.classList.remove('show');
    }
  },

  // Tên hiển thị (h1) lấy từ global_name (display name) của Discord, @handle lấy từ username.
  applyIdentity(discordUser){
    if (!discordUser) return;
    const nameEl = document.querySelector('.id-text h1');
    const handleEl = document.querySelector('.id-text .handle');
    if (nameEl) nameEl.textContent = discordUser.global_name || discordUser.username;
    if (handleEl) handleEl.textContent = '@' + discordUser.username;
  },

  // Hiện badge "Đang chơi <game>" / "Đang nghe <nhạc>" / custom status ngay
  // dưới @handle. Nếu là hoạt động thật (chơi game, nghe Spotify, xem...) thì
  // badge có thể bấm vào để mở rộng ra panel chi tiết bên dưới nó.
  applyActivity(activities){
    const badgeEl = document.querySelector('#discordActivity');
    if (!badgeEl) return;

    const list = activities || [];
    const custom = list.find(a => a.type === 4);
    // ưu tiên "đang chơi game" (type 0) nếu có nhiều hoạt động cùng lúc
    const real = list.find(a => a.type === 0) || list.find(a => a.type !== 4);

    this.currentActivity = real || null;

    let badgeHtml = '';
    if (real){
      const meta = this.activityMeta[real.type] || { verb: '', icon: ICONS.game };
      const imgUrl = this.activityImageUrl(real);
      const iconHtml = imgUrl ? `<img src="${imgUrl}" alt="">` : (meta.icon || ICONS.game);
      const detailParts = [real.details, real.state].filter(Boolean).join(' • ');
      badgeHtml = `${iconHtml}<span><b>${meta.verb} ${real.name}</b>${detailParts ? ' — ' + detailParts : ''}</span>${ICONS.chevron}`;
    } else if (custom && (custom.state || custom.emoji)){
      const emoji = custom.emoji && custom.emoji.name ? custom.emoji.name + ' ' : '';
      badgeHtml = `<span>${emoji}${custom.state || ''}</span>`;
    }

    if (badgeHtml){
      badgeEl.innerHTML = badgeHtml;
      badgeEl.style.display = 'flex';
      badgeEl.classList.toggle('clickable', !!real);
    } else {
      badgeEl.innerHTML = '';
      badgeEl.style.display = 'none';
    }

    if (!real){
      this.setDetailOpen(false);
    } else if (this.detailOpen){
      this.renderDetail();
    }

    this.bindActivityClick();
  },

  // Panel mở rộng: ảnh lớn hơn + tên đầy đủ + details/state đầy đủ +
  // "đã chơi/nghe được bao lâu" tính từ timestamps.start.
  renderDetail(){
    const detailEl = document.querySelector('#activityDetail');
    if (!detailEl) return;
    const a = this.currentActivity;
    if (!a){ detailEl.innerHTML = ''; return; }

    const meta = this.activityMeta[a.type] || { verb: '' };
    const imgUrl = this.activityImageUrl(a);
    const timeText = (a.timestamps && a.timestamps.start) ? this.timeSince(a.timestamps.start) : '';

    detailEl.innerHTML = `
      <div class="activity-detail-inner">
        ${imgUrl ? `<img src="${imgUrl}" alt="">` : ''}
        <div class="activity-detail-text">
          <div class="activity-detail-name">${a.name}</div>
          ${a.details ? `<div class="activity-detail-line">${a.details}</div>` : ''}
          ${a.state ? `<div class="activity-detail-line">${a.state}</div>` : ''}
          ${timeText ? `<div class="activity-detail-time">${meta.verb} được ${timeText}</div>` : ''}
        </div>
      </div>
    `;
  },

  setDetailOpen(open){
    this.detailOpen = open;
    const badgeEl = document.querySelector('#discordActivity');
    const detailEl = document.querySelector('#activityDetail');
    if (badgeEl) badgeEl.classList.toggle('open', open);
    if (detailEl) detailEl.classList.toggle('open', open);
    if (open) this.renderDetail();
  },

  // Gắn sự kiện click 1 lần duy nhất (badge được cập nhật innerHTML liên tục
  // qua các lần poll, nhưng bản thân phần tử #discordActivity không đổi).
  bindActivityClick(){
    const badgeEl = document.querySelector('#discordActivity');
    if (!badgeEl || badgeEl.dataset.bound) return;
    badgeEl.dataset.bound = '1';
    badgeEl.addEventListener('click', () => {
      if (!this.currentActivity) return;
      this.setDetailOpen(!this.detailOpen);
    });
  },

  applyStatus(status){
    const info = this.colors[status] || this.colors.offline;

    const dot = document.querySelector('#status .dot');
    const labelEl = document.querySelector('#status span:last-child');
    const avatarEl = document.querySelector('.avatar');

    if (dot) dot.style.setProperty('--status-rgb', info.rgb);
    if (labelEl) labelEl.textContent = info.label;
    // Quầng sáng kiểu đám mây quanh avatar đổi màu theo trạng thái (xem @keyframes cloudGlow)
    if (avatarEl) avatarEl.style.setProperty('--status-rgb', info.rgb);
  },

  async fetchPresence(){
    const { userId, useAvatar, useAvatarDecoration, useIdentity, useActivity, useStatus } = BIO_CONFIG.discord;
    if (!userId) return;
    try{
      const res = await fetch(`https://api.lanyard.rest/v1/users/${userId}`);
      const json = await res.json();
      if (!json.success) throw new Error('Lanyard trả về lỗi — kiểm tra userId hoặc đã join server Lanyard chưa');
      const d = json.data;
      if (useAvatar) this.applyAvatar(d.discord_user);
      if (useAvatarDecoration) this.applyDecoration(d.discord_user);
      if (useIdentity) this.applyIdentity(d.discord_user);
      if (useActivity) this.applyActivity(d.activities);
      if (useStatus) this.applyStatus(d.discord_status);
    }catch(e){
      console.warn('[Discord] Không lấy được trạng thái:', e.message);
    }
  },

  init(){
    // gán icon SVG vào activityMeta ở đây (ICONS đã có sẵn khi init() chạy)
    this.activityMeta[0].icon = ICONS.game;
    this.activityMeta[1].icon = ICONS.stream;
    this.activityMeta[2].icon = ICONS.music_activity;
    this.activityMeta[3].icon = ICONS.eye;
    this.activityMeta[5].icon = ICONS.game;

    const cfg = BIO_CONFIG.discord;
    if (!cfg.enabled || !cfg.userId) return; // chưa bật hoặc chưa điền userId thì bỏ qua, giữ avatar/tên tĩnh
    this.fetchPresence();
    setInterval(() => this.fetchPresence(), cfg.pollIntervalMs || 20000);
  }
};

renderNav();
renderProfile();
renderSocials();
renderFooter();
Player.mount();
Weather.init();
Discord.init();
</script>
