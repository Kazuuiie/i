<!DOCTYPE html>
<html lang="en" data-theme="dark" data-status="online">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kazuuiie</title>
  <meta name="theme-color" content="#080d1b">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235b8cff' d='M12 1c.6 5.2 2.8 9.4 9 11-6.2 1.6-8.4 5.8-9 11-.6-5.2-2.8-9.4-9-11 6.2-1.6 8.4-5.8 9-11z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root {
  --side-w: 264px;
  --gap: 24px;
  --r-card: 24px;
  --r-tile: 16px;
  --r-btn: 14px;

  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --ok: #35d6a0;
  --idle: #f4b740;
  --dnd: #ff6b7d;
  --off: #6c789f;
  --st: var(--ok);
}

:root[data-status="idle"]    { --st: var(--idle); }
:root[data-status="dnd"]     { --st: var(--dnd); }
:root[data-status="offline"] { --st: var(--off); }

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #080d1b;
  --side: #0a1020;
  --surface: #0d1528;
  --surface-2: #131d38;
  --line: rgba(122, 152, 235, .14);
  --line-strong: rgba(122, 152, 235, .28);
  --text: #e7edff;
  --text-2: #a6b6ea;
  --bio: #97abf0;
  --role: #8797c4;
  --muted: #6d7ba8;
  --accent: #5b8cff;
  --accent-soft: rgba(91, 140, 255, .16);
  --play-bg: linear-gradient(180deg, #2a3f7a, #1b2b58);
  --glow: rgba(70, 110, 255, .11);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 12px 40px rgba(0, 0, 0, .28);
  --dock-shadow: 0 18px 50px rgba(0, 0, 0, .45);
}

:root[data-theme="light"] {
  color-scheme: light;
  --bg: #edf1fb;
  --side: #f6f8fe;
  --surface: #ffffff;
  --surface-2: #eff3fd;
  --line: rgba(40, 70, 150, .13);
  --line-strong: rgba(40, 70, 150, .26);
  --text: #101a3a;
  --text-2: #3b4c7c;
  --bio: #3d55a6;
  --role: #6a78a6;
  --muted: #7583ad;
  --accent: #3b6cf0;
  --accent-soft: rgba(59, 108, 240, .12);
  --play-bg: linear-gradient(180deg, #d4e0ff, #bfd0fb);
  --glow: rgba(70, 110, 255, .10);
  --shadow: 0 10px 30px rgba(40, 70, 150, .08);
  --dock-shadow: 0 18px 44px rgba(40, 70, 150, .18);
}

/* ==========================================================================
   Base
   ========================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background:
    radial-gradient(900px 520px at 72% -8%, var(--glow), transparent 62%),
    var(--bg);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  transition: background-color .25s, color .25s;
}

a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p, dl, dd { margin: 0; }
img { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 10px; }

.ic { width: 20px; height: 20px; flex: none; display: block; }
[data-icon] { display: inline-flex; flex: none; }

/* ==========================================================================
   Layout
   ========================================================================== */
.app {
  display: grid;
  grid-template-columns: var(--side-w) minmax(0, 1fr);
  min-height: 100vh;
}

.main { padding: 92px 36px 150px 28px; }

.grid {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr);
  gap: var(--gap);
  max-width: 1240px;
  margin-inline: auto;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-card);
  box-shadow: var(--shadow);
  transition: background-color .25s, border-color .25s;
}

/* card header shared */
.c-head { display: flex; align-items: center; gap: 14px; }
.c-head > [data-icon] .ic { width: 24px; height: 24px; color: var(--text-2); }
.c-head h2 { font-size: 18px; font-weight: 600; letter-spacing: -.005em; }
.c-go { margin-left: auto; display: inline-flex; color: var(--text-2); }
.c-go .ic { width: 18px; height: 18px; }
a.c-go:hover { color: var(--accent); }
.c-meta { margin-left: auto; font-size: 13px; color: var(--accent); }

/* ==========================================================================
   Sidebar
   ========================================================================== */
.sidebar {
  position: sticky; top: 0;
  height: 100vh;
  display: flex; flex-direction: column;
  padding: 30px 16px 22px;
  background: var(--side);
  border-right: 1px solid var(--line);
  overflow-y: auto;
  scrollbar-width: none;
  transition: background-color .25s;
}
.sidebar::-webkit-scrollbar { display: none; }

.brand { display: flex; align-items: center; gap: 14px; padding: 0 8px 28px; }
.brand-mark { color: var(--accent); }
.brand-mark .ic { width: 34px; height: 34px; }
.brand-text { display: grid; line-height: 1.25; }
.brand-text strong { font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.brand-text small { font-size: 12px; color: var(--muted); }

.nav { display: grid; gap: 6px; }
.nav a {
  display: flex; align-items: center; gap: 16px;
  padding: 11px 16px;
  border-radius: var(--r-btn);
  color: var(--text-2);
  font-size: 15px;
  transition: background-color .15s, color .15s;
}
.nav a:hover { background: var(--accent-soft); color: var(--text); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--text); }
.nav a[aria-current="page"] .ic { color: var(--accent); }


.theme-switch button {
  width: 38px; height: 38px; border-radius: 13px;
  display: grid; place-items: center; color: var(--muted);
  transition: background-color .15s, color .15s;
}
.theme-switch button:hover { color: var(--text); }
.theme-switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--text); }
.theme-switch .ic { width: 18px; height: 18px; }

/* ==========================================================================
   Profile
   ========================================================================== */
.profile {
  position: relative;
  display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 34px;
  padding: 38px 40px 40px 38px;
  align-items: start;
}

.status { position: absolute; top: 24px; right: 24px; display: flex; align-items: center; gap: 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 10px;
  padding: 9px 18px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 14px;
}
.pill .dot { width: 9px; height: 9px; box-shadow: none; }
.circle {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2);
  transition: color .15s, border-color .15s;
}
.circle:hover { color: var(--text); border-color: var(--line-strong); }
.circle .ic { width: 19px; height: 19px; }

.avatar { position: relative; width: 190px; height: 190px; }
.avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 30px; border: 2px solid var(--line-strong); display: block; background: var(--surface-2); }
.avatar .pres { right: 2px; bottom: 2px; width: 28px; height: 28px; border-width: 5px; }

.p-body { min-width: 0; padding-top: 2px; }
.profile h1 {
  display: flex; align-items: center; gap: 12px;
  font-size: 36px; font-weight: 700; letter-spacing: -.025em; line-height: 1.15;
  margin-top: 30px;
}
.verified { display: inline-flex; color: var(--accent); }
.verified .ic { width: 22px; height: 22px; }

.roles {
  font-family: var(--mono); font-size: 15.5px; letter-spacing: .05em;
  color: var(--role); margin-top: 14px;
}
.bio { font-size: 16px; line-height: 1.5; color: var(--bio); }
.profile .bio { margin-top: 26px; line-height: 1.47; }
.bio .ln { display: block; }
/* thẻ đủ rộng → giữ ngắt dòng như trong config; thẻ hẹp → tự xuống dòng */
.p-body, .about { container-type: inline-size; }
@container (max-width: 380px) { .bio .ln { display: inline; } }

.socials { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 30px; }
.socials a {
  width: 47px; height: 47px; border-radius: var(--r-btn);
  display: grid; place-items: center;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text);
  transition: transform .15s, border-color .15s, color .15s;
}
.socials a:hover { transform: translateY(-2px); border-color: var(--accent); color: var(--accent); }
.socials .ic { width: 22px; height: 22px; }

/* ==========================================================================
   About
   ========================================================================== */
.about { padding: 26px 30px 30px; }
.about .bio { margin-top: 22px; line-height: 1.5; }
.info { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 18px; }
.info > div { display: flex; align-items: flex-start; gap: 14px; min-width: 0; }
.info .ic { width: 26px; height: 26px; color: var(--accent); margin-top: 2px; }
.info dt { font-size: 13px; color: var(--muted); line-height: 1.3; }
.info dd { font-size: 14px; color: var(--text); margin-top: 3px; line-height: 1.35; }

/* ==========================================================================
   Quick links
   ========================================================================== */
.links { padding: 26px 22px 14px; }
.links .c-head { padding: 0 8px; }
#lItems { margin-top: 14px; }
.qrow {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) 18px; gap: 14px; align-items: center;
  padding: 10px 8px; border-radius: var(--r-btn);
  transition: background-color .15s;
}
.qrow:hover { background: var(--surface-2); }
.qrow > [data-icon] .ic { width: 30px; height: 30px; color: var(--text); }
.q-t { display: grid; line-height: 1.35; min-width: 0; }
.q-t b { font-size: 14.5px; font-weight: 500; }
.q-t small { font-size: 13.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-go { color: var(--text-2); display: inline-flex; }
.q-go .ic { width: 17px; height: 17px; }

/* ==========================================================================
   Progress bar + waveform (shared)
   ========================================================================== */
.bar { position: relative; height: 16px; cursor: pointer; touch-action: none; --p: 0%; }
.bar::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px;
  border-radius: 4px; background: var(--line-strong);
}
.bar .fill {
  position: absolute; left: 0; top: 50%; height: 4px; margin-top: -2px; width: var(--p);
  border-radius: 4px; background: var(--accent);
}
.bar .fill::after {
  content: ""; position: absolute; right: -5px; top: 50%; width: 10px; height: 10px; margin-top: -5px;
  border-radius: 50%; background: var(--accent);
  box-shadow: 0 0 0 4px transparent; transition: box-shadow .15s;
}
.bar:hover .fill::after, .bar:focus-visible .fill::after { box-shadow: 0 0 0 4px var(--accent-soft); }

.wave { display: inline-flex; align-items: center; gap: 2px; height: 20px; color: var(--accent); }
.wave.green { color: var(--ok); }
.wave i { display: block; width: 2px; height: 4px; border-radius: 2px; background: currentColor; }
.is-playing .wave i { animation: wv .9s ease-in-out infinite alternate; animation-delay: calc(var(--n) * -.13s); }
@keyframes wv { from { height: 3px; } to { height: var(--h); } }

/* ==========================================================================
   Buttons used by the player
   ========================================================================== */
.play {
  width: 46px; height: 46px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--play-bg); color: var(--text);
  border: 1px solid var(--line-strong);
  transition: transform .12s, border-color .15s;
}
.play:hover { border-color: var(--accent); }
.play:active { transform: scale(.94); }
.play .ic { width: 19px; height: 19px; }
.js-toggle .i-pause { display: none; }
.is-playing .js-toggle .i-play { display: none; }
.is-playing .js-toggle .i-pause { display: inline-flex; }

.ghost { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2); transition: color .15s, background-color .15s; }
.ghost:hover { color: var(--text); background: var(--accent-soft); }
.ghost .ic { width: 18px; height: 18px; }

/* ==========================================================================
   Dock
   ========================================================================== */
.dock-wrap {
  position: fixed; z-index: 40;
  left: var(--side-w); right: 0; bottom: 24px;
  padding: 0 36px 0 28px;
  pointer-events: none;
}
.dock {
  position: relative; pointer-events: auto;
  max-width: 1240px; margin-inline: auto;
  height: 84px;
  display: flex; align-items: center;
  padding: 0 18px 0 16px;
  border-radius: var(--r-card);
  border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: var(--dock-shadow);
}

/* terminal */
.term { flex: 1 1 0; min-width: 0; display: flex; align-items: center; gap: 16px; cursor: text; }
.term-ic {
  width: 46px; height: 46px; border-radius: var(--r-btn); flex: none;
  display: grid; place-items: center;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text-2);
}
.term-ic .ic { width: 20px; height: 20px; }
.term-body { display: grid; gap: 1px; min-width: 0; font-family: var(--mono); font-size: 13px; }
.prompt { color: var(--muted); white-space: nowrap; }
.pu { color: var(--accent); }
#termInput {
  width: 100%; border: 0; outline: 0; background: transparent; padding: 2px 0;
  font: inherit; color: var(--text); caret-color: var(--accent);
}
#termInput::placeholder { color: var(--muted); opacity: .7; }
.term:focus-within .term-ic { border-color: var(--accent); color: var(--accent); }

.divider { width: 1px; height: 46px; background: var(--line); margin: 0 22px; flex: none; }

/* now playing */
.now { flex: 0 0 300px; min-width: 0; }
.now-top { display: flex; align-items: center; gap: 12px; }
.now-top .cover { width: 36px; height: 36px; border-radius: 9px; }
.now-meta { display: grid; min-width: 0; flex: 1; line-height: 1.3; }
.now-meta b { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.now-meta small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mode { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--muted); }
.mode:hover { color: var(--text); background: var(--accent-soft); }
.mode .ic { width: 15px; height: 15px; }
.now-prog { display: flex; align-items: center; gap: 10px; margin-top: 4px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.now-prog .bar { flex: 1; }

.ctrls { display: flex; align-items: center; gap: 10px; margin-left: 26px; flex: none; }
.ctrls .play { width: 44px; height: 44px; }

.vol { display: flex; align-items: center; gap: 6px; margin-left: 22px; flex: none; }
.vol input {
  -webkit-appearance: none; appearance: none;
  width: 100px; height: 16px; background: transparent; cursor: pointer; margin: 0; --v: 60%;
}
.vol input::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--accent) var(--v), var(--line-strong) var(--v)); }
.vol input::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; margin-top: -3.5px; border-radius: 50%; background: var(--accent); border: 0; }
.vol input::-moz-range-track { height: 4px; border-radius: 4px; background: var(--line-strong); }
.vol input::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--accent); }
.vol input::-moz-range-thumb { width: 11px; height: 11px; border: 0; border-radius: 50%; background: var(--accent); }

.listbtn {
  position: relative; flex: none; margin-left: 30px;
  width: 42px; height: 42px; border-radius: var(--r-btn);
  display: grid; place-items: center;
  border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--text);
  transition: border-color .15s, color .15s;
}
.listbtn:hover, .listbtn[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
.listbtn .ic { width: 20px; height: 20px; }
.chev { flex: none; margin-left: 10px; width: 28px; height: 34px; display: grid; place-items: center; color: var(--text-2); }
.chev:hover { color: var(--text); }
.chev .ic { width: 16px; height: 16px; transition: transform .2s; }
.chev[aria-expanded="false"] .ic { transform: rotate(180deg); }

/* tooltip (giống ảnh mẫu) */
[data-tip]::after {
  content: attr(data-tip);
  position: absolute; bottom: calc(100% + 12px); right: -8px;
  white-space: nowrap; padding: 6px 12px; border-radius: 9px;
  font-size: 12px; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--line-strong);
  opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: opacity .15s, transform .15s;
}
[data-tip]:hover::after, [data-tip]:focus-visible::after { opacity: 1; transform: none; }
[data-tip][aria-expanded="true"]::after { display: none; }

/* collapsed dock */
.dock.collapsed { max-width: none; width: max-content; margin-inline: auto 0; }
.dock.collapsed .term, .dock.collapsed .divider, .dock.collapsed .vol, .dock.collapsed .now-prog { display: none; }
.dock.collapsed .now { flex-basis: 210px; }
.dock.collapsed .ctrls { margin-left: 18px; }
.dock.collapsed .listbtn { margin-left: 18px; }

/* popovers above dock */
.pop, .termout, .toast {
  position: absolute; bottom: calc(100% + 14px);
  border: 1px solid var(--line-strong); border-radius: 20px;
  background: var(--surface);
  box-shadow: var(--dock-shadow);
}
.pop { right: 0; width: min(380px, 100%); padding: 16px 14px 12px; display: none; }
.pop.open { display: block; }
.pop-head { display: flex; align-items: baseline; justify-content: space-between; padding: 0 10px 12px; }
.pop-head b { font-size: 15px; font-weight: 600; }
.pop-head small { font-size: 12.5px; color: var(--muted); }
.pop .tracks { margin-top: 0; padding-top: 10px; max-height: min(320px, 50vh); }

.termout {
  left: 0; width: min(520px, 100%); max-height: 300px; overflow-y: auto;
  padding: 14px 16px 12px; display: none;
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65; color: var(--text-2);
}
.termout.open { display: block; }
.termout .x { position: sticky; float: right; top: 0; color: var(--muted); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 8px; }
.termout .x:hover { color: var(--text); background: var(--accent-soft); }
.termout .x .ic { width: 14px; height: 14px; }
.termout .ln { white-space: pre-wrap; word-break: break-word; }
.termout .cmd { color: var(--text); }
.termout .cmd .pr { color: var(--accent); }
.termout .err { color: var(--dnd); }

.toast {
  left: 50%; transform: translate(-50%, 6px);
  padding: 9px 16px; border-radius: 999px; font-size: 13px; white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }


/* ==========================================================================
   Profile layout + Discord live card
   ========================================================================== */
.profile {
  grid-column: 1;
  grid-row: span 2;
  min-height: 520px;
}
.about,
.links {
  grid-column: 2;
}

.profile-left {
  min-width: 190px;
  display: grid;
  align-content: start;
  gap: 18px;
}

.discord-card {
  display: none;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: color-mix(in srgb, var(--surface-2) 72%, transparent);
  box-shadow: 0 8px 26px rgba(0,0,0,.14);
}

.dc-head,
.dc-heading,
.dc-user,
.dc-activity {
  display: flex;
  align-items: center;
}

.dc-head {
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 13px;
}
.dc-heading {
  gap: 9px;
  min-width: 0;
}
.dc-logo {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
}
.dc-logo .ic {
  width: 17px;
  height: 17px;
}
.dc-heading h3 {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.2;
}
.dc-heading small {
  display: block;
  margin-top: 2px;
  font-size: 10.5px;
  color: var(--muted);
}
.dc-live {
  width: 7px;
  height: 7px;
  box-shadow: none;
}

.dc-user {
  gap: 10px;
  margin-bottom: 12px;
}
.dc-av {
  position: relative;
  flex: none;
}
.dc-av img {
  width: 38px;
  height: 38px;
  display: block;
  border-radius: 11px;
  object-fit: cover;
  background: var(--surface);
}
.dc-av .pres {
  right: -3px;
  bottom: -3px;
  width: 11px;
  height: 11px;
  border-width: 2.5px;
}
.dc-user-meta {
  display: grid;
  min-width: 0;
  line-height: 1.3;
}
.dc-user-meta b {
  font-size: 12.5px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dc-user-meta small {
  margin-top: 1px;
  font-size: 10.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dc-activity {
  gap: 10px;
  padding: 9px;
  min-height: 56px;
  border-radius: 13px;
  background: color-mix(in srgb, var(--surface) 84%, transparent);

}
.dc-art-wrap {
  position: relative;
  width: 42px;
  height: 42px;
  flex: none;
}
.dc-art {
  width: 42px;
  height: 42px;
  object-fit: cover;
  border-radius: 10px;
  display: block;
  background: var(--surface-2);
}
.dc-art-icon {
  position: absolute;
  right: -4px;
  bottom: -4px;
  width: 19px;
  height: 19px;
  display: grid;
  place-items: center;
  border: 2px solid var(--surface);
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--accent);
}
.dc-art-icon .ic {
  width: 11px;
  height: 11px;
}
.dc-activity-meta {
  min-width: 0;
  display: grid;
  line-height: 1.25;
}
.dc-activity-meta b {
  font-size: 11.5px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dc-activity-meta small,
.dc-custom {
  font-size: 10.5px;
  color: var(--muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dc-custom {
  color: var(--text-2);
}
.discord-card.is-offline .dc-activity {
  opacity: .76;
}
.discord-card.is-error .dc-activity {
  border-style: dashed;
}
.discord-card.activity-visible {
  display: block;
}
.discord-card.activity-visible .dc-activity {
  border-color: color-mix(in srgb, var(--line) 80%, var(--accent));
}

    github: '<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>',
    discord: '<path d="M20.317 4.3698a19.7913 19.7913 0 00-4.8851-1.5152.0741.0741 0 00-.0785.0371c-.211.3753-.4447.8648-.6083 1.2495-1.8447-.2762-3.68-.2762-5.4868 0-.1636-.3933-.4058-.8742-.6177-1.2495a.077.077 0 00-.0785-.037 19.7363 19.7363 0 00-4.8852 1.515.0699.0699 0 00-.0321.0277C.5334 9.0458-.319 13.5799.0992 18.0578a.0824.0824 0 00.0312.0561c2.0528 1.5076 4.0413 2.4228 5.9929 3.0294a.0777.0777 0 00.0842-.0276c.4616-.6304.8731-1.2952 1.226-1.9942a.076.076 0 00-.0416-.1057c-.6528-.2476-1.2743-.5495-1.8722-.8923a.077.077 0 01-.0076-.1277c.1258-.0943.2517-.1923.3718-.2914a.0743.0743 0 01.0776-.0105c3.9278 1.7933 8.18 1.7933 12.0614 0a.0739.0739 0 01.0785.0095c.1202.099.246.1981.3728.2924a.077.077 0 01-.0066.1276 12.2986 12.2986 0 01-1.873.8914.0766.0766 0 00-.0407.1067c.3604.698.7719 1.3628 1.225 1.9932a.076.076 0 00.0842.0286c1.961-.6067 3.9495-1.5219 6.0023-3.0294a.077.077 0 00.0313-.0552c.5004-5.177-.8382-9.6739-3.5485-13.6604a.061.061 0 00-.0312-.0286zM8.02 15.3312c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9555-2.4189 2.157-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.9555 2.4189-2.1569 2.4189zm7.9748 0c-1.1825 0-2.1569-1.0857-2.1569-2.419 0-1.3332.9554-2.4189 2.1569-2.4189 1.2108 0 2.1757 1.0952 2.1568 2.419 0 1.3332-.946 2.4189-2.1568 2.4189Z"/>',
    youtube: '<path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>',
    "x-twitter": '<path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932ZM17.61 20.644h2.039L6.486 3.24H4.298Z"/>',
    verified: '<path d="M3.85 8.62a4 4 0 0 1 4.78-4.77 4 4 0 0 1 6.74 0 4 4 0 0 1 4.78 4.78 4 4 0 0 1 0 6.74 4 4 0 0 1-4.77 4.78 4 4 0 0 1-6.75 0 4 4 0 0 1-4.78-4.77 4 4 0 0 1 0-6.76Z"/><path d="m9 12 2 2 4-4" fill="none" stroke="var(--surface)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>',
  };

  const SOLID = {
    play: '<polygon points="7 4 20 12 7 20 7 4"/>',
    pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
    prev: '<polygon points="19 20 9 12 19 4 19 20"/><line x1="5" x2="5" y1="19" y2="5"/>',
    next: '<polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/>',
  };

  function icon(name) {
    if (FILL[name]) return svgFill(FILL[name]);
    if (SOLID[name]) return `<svg class="ic" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SOLID[name]}</svg>`;
    return `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${STROKE[name] || STROKE.link}</svg>`;
  }
  function svgFill(p) { return `<svg class="ic" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${p}</svg>`; }

  // Trong config, icon "x" của mạng xã hội = logo X. Trong giao diện, "x" là nút đóng.
  const brandIcon = (n) => (n === "x" ? "x-twitter" : n);

  const hydrate = (r = document) => $$("[data-icon]", r).forEach((el) => { el.innerHTML = icon(el.dataset.icon); });

  /* ---------------------------------------------------------- fallback art */
  const FALLBACK_DISC = svgData(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3f8f"/><stop offset="1" stop-color="#0e1733"/></linearGradient></defs><rect width="120" height="120" fill="url(#g)"/><g fill="none" stroke="#8fb0ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".85" transform="translate(30 30) scale(2.5)"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></g></svg>'
  );
  const avatarFallback = (name) => svgData(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f5bd0"/><stop offset="1" stop-color="#1a2350"/></linearGradient></defs><rect width="120" height="120" fill="url(#g)"/><text x="60" y="76" font-family="Arial,sans-serif" font-size="52" font-weight="700" fill="#e7edff" text-anchor="middle">${esc((name || "?").charAt(0).toUpperCase())}</text></svg>`
  );
  // image fallback: Discord + music art should never leave a broken image.
  document.addEventListener("error", (e) => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement) || img.dataset.fb === "1") return;
    img.dataset.fb = "1";

    if (img.id === "pAvatar" || img.id === "dcAvatar") {
      img.src = profile.avatar || dc.avatar || avatarFallback(profile.name || dc.name);
      return;
    }
    if (img.id === "dcActivityArt" || img.classList.contains("js-disc") || img.closest(".trk")) {
      img.src = FALLBACK_DISC;
    }
  }, true);

  /* ------------------------------------------------------------ static text */
  const brand = C.brand || {};
  const profile = C.profile || {};
  document.title = (C.site && C.site.title) || brand.name || document.title;
  $("#brandName").textContent = brand.name || "";
  $("#brandTag").textContent = brand.tagline || "";
  $("#footNote").textContent = (C.site && C.site.footNote) || "";

  $("#nav").innerHTML = (C.nav || []).map((n) =>
    `<a href="${esc(n.href || "#")}"${n.active ? ' aria-current="page"' : ""}>${icon(n.icon)}<span>${esc(n.label)}</span></a>`
  ).join("");

  // profile
  $("#pName").textContent = profile.name || "";
  $("#pAvatar").src = profile.avatar || avatarFallback(profile.name);
  const verified = $("#pVerified");
  if (profile.verified) verified.innerHTML = icon("verified"); else verified.remove();
  $("#pRoles").textContent = (profile.roles || []).join(" / ");
  const lines = (arr) => (arr || []).map((l) => `<span class="ln">${esc(l)} </span>`).join("");
  $("#pBio").innerHTML = lines(profile.bio);

  $("#socials").innerHTML = (C.socials || []).map((s) =>
    `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(s.label)}" title="${esc(s.label)}">${icon(brandIcon(s.icon))}</a>`
  ).join("");

  // about
  const about = C.about || {};
  $("#aTitle").textContent = about.title || "About";
  if (about.href) $("#aGo").href = about.href; else $("#aGo").remove();
  $("#aText").innerHTML = lines(about.text);
  $("#aInfo").innerHTML = (about.info || []).map((i) =>
    `<div>${icon(i.icon)}<div><dt>${esc(i.label)}</dt><dd>${esc(i.value)}</dd></div></div>`
  ).join("");

  // quick links
  const links = C.links || {};
  $("#lTitle").textContent = links.title || "Links";
  $("#lItems").innerHTML = (links.items || []).map((l) => {
    const ext = /^https?:/i.test(l.url || "");
    return `<a class="qrow" href="${esc(l.url)}"${ext ? ' target="_blank" rel="noopener noreferrer"' : ""}>
      <span>${icon(brandIcon(l.icon))}</span>
      <span class="q-t"><b>${esc(l.title)}</b><small>${esc(l.text)}</small></span>
      <span class="q-go">${icon("chevron-right")}</span></a>`;
  }).join("");

  // discord card
  const dc = C.discord || {};
  $("#dcName").textContent = dc.name || profile.name || "";
  $("#dcAvatar").src = dc.avatar || profile.avatar || avatarFallback(dc.name);
  $("#dcActivity").textContent = dc.activity || "";
  $("#dcIcon").innerHTML = icon(dc.activityIcon || "gamepad");

  // terminal labels
  const T = C.terminal || {};
  const tUser = T.user || "user", tHost = "@" + (T.host || "bio");
  $("#tUser").textContent = tUser;
  $("#tHost").textContent = tHost;

  hydrate();

  /* ------------------------------------------------------------------ status */
  const STATUS = { online: "Online", idle: "Idle", dnd: "Do not disturb", offline: "Offline" };
  function setStatus(s) {
    s = STATUS[s] ? s : "online";
    root.dataset.status = s;
    $("#statusText").textContent = STATUS[s];
  }
  setStatus(profile.status);

  /* --------------------------------------------------------- Discord presence */
  const DC_STATUS = {
    online: "Online",
    idle: "Idle",
    dnd: "Do not disturb",
    offline: "Offline"
  };
  const DC_TYPE = {
    0: { label: "Playing", icon: "gamepad" },
    1: { label: "Streaming", icon: "globe" },
    2: { label: "Listening", icon: "music" },
    3: { label: "Watching", icon: "image" },
    4: { label: "Custom", icon: "heart" },
    5: { label: "Competing", icon: "target" }
  };

  const dcCacheKey = "discord:presence:" + String(dc.lanyardId || "");
  let dcSocket = null;
  let dcHeartbeat = null;
  let dcReconnect = null;
  let dcReconnectDelay = Math.max(500, Number(dc.reconnectBaseMs) || 1500);
  let dcConnected = false;
  let lastPresenceAt = 0;

  const setDcConnection = (state, label) => {
    const card = $(".discord-card");
    const el = $("#dcConnection");
    if (el) el.textContent = label || state;
    card?.classList.toggle("is-error", state === "error");
    card?.classList.toggle("is-offline", state === "offline");
    const dot = $("#dcLiveDot");
    if (dot) {
      dot.dataset.connection = state;
      dot.style.background = state === "live"
        ? "var(--ok)"
        : state === "fallback"
          ? "var(--idle)"
          : state === "error"
            ? "var(--dnd)"
            : "var(--off)";
    }
  };

  const cachePresence = (data) => {
    if (!dc.lanyardId || !data) return;
    try {
      localStorage.setItem(dcCacheKey, JSON.stringify({ at: Date.now(), data }));
    } catch {}
  };

  const getCachedPresence = () => {
    if (!dc.lanyardId) return null;
    try {
      const raw = localStorage.getItem(dcCacheKey);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed?.data || Date.now() - parsed.at > (Number(dc.cacheMs) || 300000)) return null;
      return parsed.data;
    } catch {
      return null;
    }
  };

  const avatarUrl = (user) => {
    if (!user?.id) return "";
    if (user.avatar) {
      const ext = String(user.avatar).startsWith("a_") ? "gif" : "png";
      return `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
    }
    return `https://api.lanyard.rest/${user.id}.png?size=256`;
  };

  const activityImage = (activity, presence) => {
    if (presence?.spotify?.album_art_url) return presence.spotify.album_art_url;
    const image = activity?.assets?.large_image;
    if (!image) return "";
    if (image.startsWith("mp:")) {
      return "https://media.discordapp.net/" + image.slice(3);
    }
    if (activity.application_id) {
      return `https://cdn.discordapp.com/app-assets/${activity.application_id}/${image}.png?size=128`;
    }
    return "";
  };

  const activityData = (presence) => {
    const activities = Array.isArray(presence?.activities) ? presence.activities : [];
    const custom = activities.find((a) => a.type === 4 && (a.state || a.emoji));
    const spotify = presence?.listening_to_spotify && presence?.spotify
      ? {
          type: 2,
          name: "Spotify",
          details: presence.spotify.song,
          state: presence.spotify.artist,
          image: presence.spotify.album_art_url,
          label: "Listening"
        }
      : null;
    const primary = activities.find((a) => a.type !== 4 && a.name !== "Spotify")
      || spotify
      || activities.find((a) => a.type === 4)
      || null;
    return { primary, custom };
  };

  const ACTIVITY_TYPES = new Set([0, 1, 2, 3, 5]);
  const isRenderableActivity = (activity) => Boolean(
    activity && ACTIVITY_TYPES.has(Number(activity.type))
  );

  const applyPresence = (presence, source = "rest") => {
    if (!presence) return;
    lastPresenceAt = Date.now();
    const user = presence.discord_user || {};
    const status = DC_STATUS[presence.discord_status] ? presence.discord_status : "offline";
    setStatus(status);

    const displayName = user.global_name || user.username || dc.name || profile.name || "Discord";
    const handle = user.username ? "@" + user.username : "";
    const avatar = avatarUrl(user) || dc.avatar || profile.avatar || avatarFallback(displayName);

    $("#pName").textContent = displayName;
    $("#pAvatar").dataset.fb = "";
    $("#pAvatar").src = avatar;

    $("#dcName").textContent = displayName;
    $("#dcHandle").textContent = handle || displayName;
    $("#dcAvatar").dataset.fb = "";
    $("#dcAvatar").src = avatar;

    const { primary, custom } = activityData(presence);
    // Discord-like Activity card: only render real activities.
    // Custom Status alone is intentionally ignored, so the whole card disappears
    // when the user is simply online/idle/offline without a game/music/etc.
    const activity = isRenderableActivity(primary) ? primary : null;
    const meta = activity
      ? (DC_TYPE[activity.type] || { label: "Activity", icon: "gamepad" })
      : null;

    const card = $(".discord-card");
    const hasActivity = Boolean(activity);
    card?.classList.toggle("activity-visible", hasActivity);
    card?.classList.toggle("is-offline", status === "offline");
    $("#dcActivityBox").classList.toggle("has-activity", hasActivity);

    if (!hasActivity) {
      // Keep the profile/presence data alive, but remove the Activity card itself.
      return;
    }

    const activityTitle = activity.details || activity.name || activity.state || meta.label;
    let activitySub = "";
    if (activity.type === 2) {
      activitySub = activity.state || "Listening";
    } else if (activity.type === 0) {
      activitySub = [activity.name, activity.state].filter(Boolean).join(" • ");
    } else {
      activitySub = [activity.name && meta.label + " " + activity.name, activity.state].filter(Boolean).join(" • ");
    }

    $("#dcActivity").textContent = activityTitle;
    $("#dcPresence").textContent = activitySub || meta.label;
    $("#dcCustom").textContent = custom
      ? [custom.emoji?.name, custom.state].filter(Boolean).join(" ")
      : "";

    const art = $("#dcActivityArt");
    const artUrl = activity.image || activityImage(activity, presence);
    if (artUrl) {
      art.dataset.fb = "";
      art.src = artUrl;
      art.style.display = "";
    } else {
      art.src = FALLBACK_DISC;
      art.style.display = "";
    }
    $("#dcIcon").innerHTML = icon(meta.icon);

    const connectionLabel = source === "ws"
      ? "Realtime"
      : source === "cache"
        ? "Cached"
        : dcConnected
          ? "Realtime"
          : "REST fallback";
    setDcConnection(
      status === "offline" && source !== "ws" ? "offline" : (source === "ws" ? "live" : "fallback"),
      connectionLabel
    );

    cachePresence(presence);
  };

  async function fetchDiscordPresence() {
    if (!dc.lanyardId || !dc.useRestFallback) return null;
    try {
      const url = (dc.restUrl || "https://api.lanyard.rest/v1/users/") + encodeURIComponent(dc.lanyardId);
      const response = await fetch(url, { cache: "no-store" });
      const json = await response.json();
      if (!json?.success || !json?.data) throw new Error("Lanyard REST response");
      applyPresence(json.data, dcConnected ? "ws" : "rest");
      return json.data;
    } catch (error) {
      const cached = getCachedPresence();
      if (cached && !lastPresenceAt) applyPresence(cached, "cache");
      if (!dcConnected) setDcConnection("error", "Connection unavailable");
      return null;
    }
  }

  function clearHeartbeat() {
    if (dcHeartbeat) clearInterval(dcHeartbeat);
    dcHeartbeat = null;
  }

  function scheduleWsReconnect() {
    if (!dc.useWebSocket || !dc.lanyardId) return;
    clearTimeout(dcReconnect);
    dcReconnect = setTimeout(connectDiscordSocket, dcReconnectDelay);
    dcReconnectDelay = Math.min(Number(dc.reconnectMaxMs) || 30000, dcReconnectDelay * 1.8);
  }

  function connectDiscordSocket() {
    if (!dc.useWebSocket || !dc.lanyardId || !window.WebSocket) {
      setDcConnection("error", "REST only");
      fetchDiscordPresence();
      return;
    }

    try {
      dcSocket?.close();
    } catch {}

    try {
      dcSocket = new WebSocket(dc.wsUrl || "wss://api.lanyard.rest/socket");
    } catch {
      scheduleWsReconnect();
      return;
    }

    dcSocket.onopen = () => {
      dcReconnectDelay = Math.max(500, Number(dc.reconnectBaseMs) || 1500);
      setDcConnection("fallback", "Connecting…");
    };

    dcSocket.onmessage = (event) => {
      let message;
      try { message = JSON.parse(event.data); } catch { return; }

      if (message.op === 1) {
        clearHeartbeat();
        const interval = Number(message.d?.heartbeat_interval) || 30000;
        dcHeartbeat = setInterval(() => {
          if (dcSocket?.readyState === WebSocket.OPEN) dcSocket.send(JSON.stringify({ op: 3 }));
        }, Math.max(5000, interval - 500));

        dcSocket.send(JSON.stringify({
          op: 2,
          d: { subscribe_to_id: String(dc.lanyardId) }
        }));
        return;
      }

      if (message.op === 0 && message.t === "INIT_STATE") {
        const state = message.d?.[String(dc.lanyardId)] || message.d;
        if (state) {
          dcConnected = true;
          applyPresence(state, "ws");
        }
        return;
      }

      if (message.op === 0 && message.t === "PRESENCE_UPDATE") {
        dcConnected = true;
        applyPresence(message.d, "ws");
      }
    };

    dcSocket.onerror = () => {
      dcConnected = false;
      setDcConnection("error", "Reconnecting…");
      fetchDiscordPresence();
    };

    dcSocket.onclose = () => {
      dcConnected = false;
      clearHeartbeat();
      setDcConnection("fallback", "REST fallback");
      fetchDiscordPresence();
      scheduleWsReconnect();
    };
  }

  const cachedDc = getCachedPresence();
  if (cachedDc) applyPresence(cachedDc, "cache");
  else {
    $("#dcName").textContent = dc.name || profile.name || "Discord";
    $("#dcHandle").textContent = dc.lanyardId ? "Loading profile…" : "Set your Discord ID";
    $("#dcActivity").textContent = "";
    $("#dcPresence").textContent = "";
    $("#dcCustom").textContent = "";
    $(".discord-card")?.classList.remove("activity-visible");
    $("#dcActivityArt").src = FALLBACK_DISC;
    $("#pAvatar").src = dc.avatar || profile.avatar || avatarFallback(profile.name);
    $("#dcAvatar").src = dc.avatar || profile.avatar || avatarFallback(profile.name);
    setDcConnection(dc.lanyardId ? "fallback" : "error", dc.lanyardId ? "Connecting…" : "Missing user ID");
  }

  if (dc.lanyardId) {
    fetchDiscordPresence();
    connectDiscordSocket();
    setInterval(() => {
      if (!dcConnected) fetchDiscordPresence();
    }, Math.max(10000, Number(dc.restIntervalMs) || 30000));
  }

  /* ------------------------------------------------------------------- theme */
  const mq = matchMedia("(prefers-color-scheme: light)");
  let themePref = store.get("theme", "dark");
  function applyTheme(pref) {
    themePref = ["dark", "light", "auto"].includes(pref) ? pref : "dark";
    const eff = themePref === "auto" ? (mq.matches ? "light" : "dark") : themePref;
    root.dataset.theme = eff;
    store.set("theme", themePref);
    $$("[data-theme-set]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.themeSet === themePref)));
    $("#themeQuick").innerHTML = icon(eff === "dark" ? "moon" : "sun");
    return eff;
  }
  $$("[data-theme-set]").forEach((b) => b.addEventListener("click", () => applyTheme(b.dataset.themeSet)));
  $("#themeQuick").addEventListener("click", () => applyTheme(root.dataset.theme === "dark" ? "light" : "dark"));
  mq.addEventListener("change", () => { if (themePref === "auto") applyTheme("auto"); });
  applyTheme(themePref);

  /* ------------------------------------------------------------ music player */
  const audio = new Audio();
  audio.preload = "metadata";
  let idx = 0;
  let mode = ["all", "one", "shuffle"].includes(store.get("mode", M.mode)) ? store.get("mode", M.mode) : "all";
  let vol = clamp(parseFloat(store.get("vol", M.volume ?? 0.6)), 0, 1);
  if (isNaN(vol)) vol = 0.6;
  const durations = [];

  const waveHTML = () => Array.from({ length: 7 }, (_, i) => `<i style="--n:${i};--h:${[8, 15, 11, 19, 13, 17, 9][i]}px"></i>`).join("");
  $$(".js-wave").forEach((w) => { w.innerHTML = waveHTML(); });

  const trackRow = (t, i) => `
    <button type="button" class="trk" data-i="${i}" aria-label="Phát ${esc(t.title)}">
      <img class="cover" src="${esc(t.disc || FALLBACK_DISC)}" alt="" loading="lazy">
      <span class="trk-meta"><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></span>
      <span class="trk-dur" data-dur="${i}">${durations[i] ? fmt(durations[i]) : "--:--"}</span>
      <span class="wave">${waveHTML()}</span>
    </button>`;

  function renderTracks() {
    const html = TRACKS.length
      ? TRACKS.map(trackRow).join("")
      : '<p class="trk-empty">Chưa có bài nào — thêm vào <b>music.tracks</b> trong BIO_CONFIG.</p>';
    const popList = $("#popList");
    if (popList) popList.innerHTML = html;
    const n = TRACKS.length + (TRACKS.length === 1 ? " track" : " tracks");
    const popCount = $("#popCount");
    if (popCount) popCount.textContent = n;
    markActive();
  }
  function markActive() {
    $$(".trk").forEach((b) => b.classList.toggle("active", Number(b.dataset.i) === idx));
  }

  // đọc độ dài từng bài (chỉ metadata)
  function probeDurations() {
    TRACKS.forEach((t, i) => {
      const a = new Audio();
      a.preload = "metadata";
      a.addEventListener("loadedmetadata", () => {
        if (isFinite(a.duration)) {
          durations[i] = a.duration;
          $$(`[data-dur="${i}"]`).forEach((el) => { el.textContent = fmt(a.duration); });
        }
        a.removeAttribute("src");
      });
      a.src = t.file;
    });
  }

  // toast
  let toastTimer;
  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3600);
  }

  function updateMeta() {
    const t = TRACKS[idx] || { title: "No music", artist: "Thêm nhạc trong BIO_CONFIG" };
    $$(".js-title").forEach((e) => { e.textContent = t.title; });
    $$(".js-artist").forEach((e) => { e.textContent = t.artist || ""; });
    $$(".js-disc").forEach((img) => { img.dataset.fb = ""; img.src = t.disc || FALLBACK_DISC; });
    markActive();
    setMediaSession(t);
  }

  function setMediaSession(t) {
    if (!("mediaSession" in navigator) || !TRACKS.length) return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: t.title, artist: t.artist || "",
        artwork: t.disc ? [{ src: new URL(t.disc, location.href).href }] : [],
      });
      navigator.mediaSession.setActionHandler("play", () => playNow());
      navigator.mediaSession.setActionHandler("pause", () => audio.pause());
      navigator.mediaSession.setActionHandler("previoustrack", prev);
      navigator.mediaSession.setActionHandler("nexttrack", next);
    } catch (e) { /* ignore */ }
  }

  function load(i, autoplay) {
    if (!TRACKS.length) return;
    idx = (i + TRACKS.length) % TRACKS.length;
    audio.src = TRACKS[idx].file;
    paint();
    updateMeta();
    if (autoplay) playNow();
  }

  async function playNow() {
    if (!TRACKS.length) return;
    if (audio.error) { audio.src = TRACKS[idx].file; }
    try {
      await audio.play();
    } catch (e) {
      if (e && e.name === "NotAllowedError") toast("Trình duyệt chặn tự phát — hãy bấm nút Play.");
      // AbortError / NotSupportedError: sự kiện "error" của audio sẽ báo
    }
  }
  const toggle = () => (audio.paused ? playNow() : audio.pause());
  function next() {
    if (!TRACKS.length) return;
    if (mode === "shuffle" && TRACKS.length > 1) {
      let n; do { n = Math.floor(Math.random() * TRACKS.length); } while (n === idx);
      load(n, true);
    } else load(idx + 1, true);
  }
  function prev() {
    if (!TRACKS.length) return;
    if (audio.currentTime > 3) audio.currentTime = 0; else load(idx - 1, true);
  }

  // giao diện theo trạng thái audio
  audio.addEventListener("play", () => document.body.classList.add("is-playing"));
  audio.addEventListener("pause", () => document.body.classList.remove("is-playing"));
  audio.addEventListener("ended", () => { if (mode === "one") { audio.currentTime = 0; playNow(); } else next(); });
  audio.addEventListener("error", () => {
    document.body.classList.remove("is-playing");
    const t = TRACKS[idx];
    if (t) toast("Không tải được: " + t.title + " — kiểm tra đường dẫn file trong BIO_CONFIG");
  });
  ["timeupdate", "loadedmetadata", "durationchange", "seeked"].forEach((ev) => audio.addEventListener(ev, paint));

  const barEls = $$(".js-bar");
  function paint() {
    const d = audio.duration, c = audio.currentTime || 0;
    const ok = isFinite(d) && d > 0;
    const p = ok ? (c / d) * 100 : 0;
    barEls.forEach((b) => { b.style.setProperty("--p", p + "%"); b.setAttribute("aria-valuenow", String(Math.round(p))); });
    $$(".js-cur").forEach((e) => { e.textContent = fmt(c); });
    $$(".js-dur").forEach((e) => { e.textContent = ok ? fmt(d) : "0:00"; });
    $$(".js-time").forEach((e) => { e.textContent = fmt(c) + " / " + (ok ? fmt(d) : "0:00"); });
    if (ok && !durations[idx]) {
      durations[idx] = d;
      $$(`[data-dur="${idx}"]`).forEach((el) => { el.textContent = fmt(d); });
    }
  }

  // tua bài (chuột, cảm ứng, bàn phím)
  barEls.forEach((bar) => {
    let drag = false;
    const seek = (e) => {
      const r = bar.getBoundingClientRect();
      const p = clamp((e.clientX - r.left) / r.width, 0, 1);
      if (isFinite(audio.duration)) audio.currentTime = p * audio.duration;
    };
    bar.addEventListener("pointerdown", (e) => { drag = true; bar.setPointerCapture(e.pointerId); seek(e); });
    bar.addEventListener("pointermove", (e) => { if (drag) seek(e); });
    bar.addEventListener("pointerup", () => { drag = false; });
    bar.addEventListener("pointercancel", () => { drag = false; });
    bar.addEventListener("keydown", (e) => {
      if (!isFinite(audio.duration)) return;
      if (e.key === "ArrowRight") { audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); e.preventDefault(); }
      if (e.key === "ArrowLeft") { audio.currentTime = Math.max(0, audio.currentTime - 5); e.preventDefault(); }
    });
  });

  // nút điều khiển
  $$(".js-toggle").forEach((b) => b.addEventListener("click", toggle));
  $("#prevBtn").addEventListener("click", prev);
  $("#nextBtn").addEventListener("click", next);

  document.addEventListener("click", (e) => {
    const row = e.target.closest(".trk");
    if (!row) return;
    const i = Number(row.dataset.i);
    if (i === idx) toggle(); else load(i, true);
  });

  // chế độ phát
  const MODE_ICON = { all: "repeat", one: "repeat-1", shuffle: "shuffle" };
  const MODE_LABEL = { all: "Lặp cả danh sách", one: "Lặp 1 bài", shuffle: "Phát ngẫu nhiên" };
  function paintMode() {
    $$(".js-mode").forEach((b) => { b.innerHTML = icon(MODE_ICON[mode]); b.title = MODE_LABEL[mode]; b.setAttribute("aria-label", MODE_LABEL[mode]); });
  }
  $$(".js-mode").forEach((b) => b.addEventListener("click", () => {
    mode = mode === "all" ? "one" : mode === "one" ? "shuffle" : "all";
    store.set("mode", mode); paintMode(); toast(MODE_LABEL[mode]);
  }));
  paintMode();

  // âm lượng
  const volInput = $("#vol"), volBtn = $("#volBtn");
  function setVol(v) {
    vol = clamp(v, 0, 1);
    audio.volume = vol;
    volInput.value = String(Math.round(vol * 100));
    volInput.style.setProperty("--v", vol * 100 + "%");
    store.set("vol", String(vol));
    paintVolIcon();
  }
  function paintVolIcon() { volBtn.innerHTML = icon(audio.muted || vol === 0 ? "volume-x" : "volume-2"); }
  volInput.addEventListener("input", () => { audio.muted = false; setVol(volInput.value / 100); });
  volBtn.addEventListener("click", () => { audio.muted = !audio.muted; paintVolIcon(); });
  setVol(vol);

  // popover danh sách phát + thu gọn dock
  const pop = $("#pop"), listBtn = $("#listBtn"), dock = $("#dock"), chev = $("#chev");
  const setPop = (open) => { pop.classList.toggle("open", open); listBtn.setAttribute("aria-expanded", String(open)); };
  listBtn.addEventListener("click", (e) => { e.stopPropagation(); setPop(!pop.classList.contains("open")); });
  document.addEventListener("click", (e) => { if (!pop.contains(e.target)) setPop(false); });
  chev.addEventListener("click", () => {
    const collapsed = dock.classList.toggle("collapsed");
    chev.setAttribute("aria-expanded", String(!collapsed));
    store.set("dock", collapsed ? "collapsed" : "open");
    if (collapsed) closeTerm();
  });
  if (store.get("dock", "open") === "collapsed") { dock.classList.add("collapsed"); chev.setAttribute("aria-expanded", "false"); }

  /* ---------------------------------------------------------------- terminal */
  const tIn = $("#termInput"), tOut = $("#termOut"), tLog = $("#termLog");
  const history = []; let hp = 0;

  function line(text, cls) {
    const d = document.createElement("div");
    d.className = "ln" + (cls ? " " + cls : "");
    if (cls === "cmd") {
      const pr = document.createElement("span");
      pr.className = "pr"; pr.textContent = tUser + tHost + ":~$ ";
      d.append(pr, document.createTextNode(text));
    } else d.textContent = text;
    tLog.appendChild(d);
    while (tLog.children.length > 80) tLog.firstChild.remove();
    tOut.classList.add("open");
    tOut.scrollTop = tOut.scrollHeight;
  }
  function closeTerm() { tOut.classList.remove("open"); }
  $("#termClose").addEventListener("click", closeTerm);

  const cur = () => TRACKS[idx];
  const COMMANDS = {
    help: () => [
      "Commands:",
      "  about            giới thiệu",
      "  socials          mạng xã hội",
      "  links            link nhanh",
      "  song             bài đang phát",
      "  playlist         danh sách bài hát",
      "  play | pause | next | prev",
      "  vol <0-100>      chỉnh âm lượng",
      "  theme <dark|light|auto>",
      "  date | echo <text> | clear",
    ],
    about: () => [profile.name + " — " + (profile.roles || []).join(" / "), ...(profile.bio || [])],
    whoami: () => COMMANDS.about(),
    socials: () => (C.socials || []).map((s) => s.label.padEnd(9) + s.url),
    links: () => ((C.links && C.links.items) || []).map((l) => l.title.padEnd(9) + l.url),
    song: () => (cur() ? [cur().title + " — " + cur().artist, fmt(audio.currentTime) + " / " + fmt(audio.duration)] : ["Chưa có bài nào."]),
    playlist: () => (TRACKS.length ? TRACKS.map((t, i) => (i === idx ? "▶ " : "  ") + (i + 1) + ". " + t.title + " — " + t.artist) : ["Chưa có bài nào."]),
    play: () => { playNow(); return ["▶ playing"]; },
    pause: () => { audio.pause(); return ["❚❚ paused"]; },
    next: () => { next(); return ["⏭ " + (cur() ? cur().title : "")]; },
    prev: () => { prev(); return ["⏮ " + (cur() ? cur().title : "")]; },
    vol: (a) => {
      const n = parseInt(a, 10);
      if (isNaN(n) || n < 0 || n > 100) return ["Dùng: vol <0-100>  (đang là " + Math.round(vol * 100) + ")"];
      audio.muted = false; setVol(n / 100); return ["volume → " + n];
    },
    theme: (a) => {
      if (!["dark", "light", "auto"].includes(a)) return ["Dùng: theme <dark|light|auto>"];
      applyTheme(a); return ["theme → " + a];
    },
    date: () => [new Date().toLocaleString()],
    echo: (a) => [a],
  };

  function run(raw) {
    const text = raw.trim();
    if (!text) return;
    history.push(text); hp = history.length;
    line(text, "cmd");
    const [cmd, ...rest] = text.split(/\s+/);
    const name = cmd.toLowerCase();
    if (name === "clear") { tLog.innerHTML = ""; closeTerm(); return; }
    const fn = COMMANDS[name];
    if (!fn) { line("command not found: " + cmd + " — gõ 'help' để xem lệnh", "err"); return; }
    fn(rest.join(" ")).forEach((l) => line(l));
  }

  tIn.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { run(tIn.value); tIn.value = ""; }
    else if (e.key === "Escape") { closeTerm(); tIn.blur(); }
    else if (e.key === "ArrowUp") { if (hp > 0) { hp--; tIn.value = history[hp] || ""; } e.preventDefault(); }
    else if (e.key === "ArrowDown") { if (hp < history.length - 1) { hp++; tIn.value = history[hp]; } else { hp = history.length; tIn.value = ""; } e.preventDefault(); }
  });

  /* -------------------------------------------------------------------- init */
  renderTracks();
  load(0, false);
  paint();
  if (TRACKS.length) probeDurations();

  if (M.autoplay && TRACKS.length) {
    playNow();
    const once = () => { if (audio.paused) playNow(); };
    document.addEventListener("pointerdown", once, { once: true });
  }
})();

</script>
</body>
</html>
