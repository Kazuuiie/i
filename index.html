<style>
:root{
  --bg:#08090d;
  --panel:rgba(22,23,29,.55);
  --panel-border:rgba(255,255,255,.08);
  --panel-strong:rgba(14,15,19,.82);
  --text:#f4f4f6;

  --text-faint:#6c6c76;
  --accent:#7dd3a8;
  --accent-2:#d8b787;
  --music-accent:#8fd6b0;
  --music-accent-soft:#c9b79d;
  --radius:18px;
  --radius-sm:12px;
  --ease:cubic-bezier(.16,.9,.3,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(125,211,168,.52) rgba(255,255,255,.035)}

::selection{background:rgba(125,211,168,.28);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.025);border-left:1px solid rgba(255,255,255,.035)}
::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:999px;background-clip:padding-box;background:linear-gradient(180deg,rgba(143,214,176,.72),rgba(125,211,168,.42));box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 12px rgba(125,211,168,.10)}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,rgba(174,238,204,.94),rgba(125,211,168,.68));box-shadow:inset 0 0 0 1px rgba(255,255,255,.13),0 0 16px rgba(125,211,168,.20)}

.bg-overlay{position:absolute;inset:0;pointer-events:none;display:none;z-index:2}
.bg-fog{position:absolute;inset:0;pointer-events:none;display:none;z-index:4;transform:translateZ(0)}

.spotlight.show{opacity:1}

.page{position:relative;z-index:8;min-height:100vh;padding:40px clamp(24px,4.2vw,74px);display:flex;flex-direction:column}
nav{display:flex;align-items:center;gap:40px;flex-wrap:wrap;row-gap:14px}
nav a{color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.03em;position:relative;padding-bottom:10px;transition:color .2s ease}

.reveal{opacity:0;transform:translateY(14px)}

.ready nav.reveal{animation-delay:.05s}.ready .status.reveal{animation-delay:.16s}.ready .identity.reveal{animation-delay:.24s}.ready .bio-text.reveal{animation-delay:.34s}.ready .tags.reveal{animation-delay:.42s}.ready .links.reveal{animation-delay:.5s}.ready .weather.reveal{animation-delay:.72s}

@keyframes statusPulse{0%{box-shadow:0 0 0 0 rgba(var(--status-rgb),.55)}70%{box-shadow:0 0 0 9px rgba(var(--status-rgb),0)}100%{box-shadow:0 0 0 0 rgba(var(--status-rgb),0)}}
.activity-wrap{display:flex;flex-direction:column}.activity-line{display:none;align-items:center;gap:8px;font-size:12.5px;color:var(--text);font-weight:600;margin-top:8px;width:fit-content;max-width:100%;background:rgba(255,255,255,.06);border:1px solid var(--panel-border);padding:5px 12px 5px 5px;border-radius:999px;transition:background .18s ease,border-color .18s ease}.activity-line.clickable{cursor:pointer}.activity-line.clickable:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16)}.activity-line img{width:20px;height:20px;border-radius:6px;flex-shrink:0;object-fit:cover;background:rgba(255,255,255,.08)}.activity-line svg{width:15px;height:15px;flex-shrink:0;opacity:.9;color:var(--accent)}.activity-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-line span b{font-weight:700}.activity-line .chevron{width:11px;height:11px;opacity:.55;margin-left:2px;flex-shrink:0;transition:transform .2s ease}.activity-line.open .chevron{transform:rotate(180deg)}
.activity-detail{max-height:0;opacity:0;overflow:hidden;width:fit-content;max-width:340px;margin-top:0;background:var(--panel-strong);border:1px solid var(--panel-border);border-radius:var(--radius-sm);transition:max-height .32s ease,opacity .25s ease,margin-top .32s ease}.activity-detail.open{max-height:240px;opacity:1;margin-top:8px}.activity-detail-inner{display:flex;gap:12px;padding:12px 14px}.activity-detail-inner img{width:54px;height:54px;border-radius:12px;flex-shrink:0;object-fit:cover;background:rgba(255,255,255,.08)}.activity-detail-text{display:flex;flex-direction:column;gap:2px;min-width:0}.activity-detail-name{font-size:13.5px;font-weight:700}.activity-detail-line{font-size:12px;color:var(--text-dim);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.activity-detail-time{font-size:11px;color:var(--text-faint);font-weight:600;margin-top:4px}
.identity{display:flex;align-items:flex-start;gap:22px}.avatar-wrap{position:relative;width:88px;height:88px;flex-shrink:0}.avatar-wrap::before{content:"";position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(from 0deg,rgba(125,211,168,.55),rgba(216,183,135,.35),transparent 40%,transparent 60%,rgba(125,211,168,.55));animation:ringSpin 9s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px));mask:radial-gradient(farthest-side,transparent calc(100% - 3px),#000 calc(100% - 3px))}@keyframes ringSpin{to{transform:rotate(360deg)}}
.avatar{--status-rgb:125,211,168;width:88px;height:88px;border-radius:50%;flex-shrink:0;background:linear-gradient(145deg,#2a2d38,#17181e);background-size:cover;background-position:center;border:1px solid var(--panel-border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;letter-spacing:.03em;color:rgba(255,255,255,.28);text-align:center;line-height:1.4;padding:6px;white-space:pre-line;animation:cloudGlow 6s ease-in-out infinite}
@keyframes cloudGlow{0%,100%{box-shadow:0 0 16px 3px rgba(var(--status-rgb),.30),0 0 34px 12px rgba(var(--status-rgb),.16),0 0 56px 22px rgba(var(--status-rgb),.08)}50%{box-shadow:0 0 22px 6px rgba(var(--status-rgb),.40),0 0 44px 16px rgba(var(--status-rgb),.20),0 0 68px 28px rgba(var(--status-rgb),.10)}}

.id-text{min-width:0}.id-text h1{font-family:'Space Grotesk','Manrope',sans-serif;font-size:36px;font-weight:700;letter-spacing:-.02em;line-height:1.1;background:linear-gradient(120deg,#fff 45%,#cfd6d1 75%,var(--accent) 130%);-webkit-background-clip:text;background-clip:text;color:transparent}.id-text .handle{margin-top:7px;font-size:14px;color:var(--text-dim);font-weight:600}.bio-text{font-size:14.5px;line-height:1.65;color:var(--text-dim);max-width:400px}.tags{display:flex;gap:10px;flex-wrap:wrap}.tag{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--panel-border);font-size:12.5px;font-weight:600;color:var(--text);transition:border-color .2s ease,background .2s ease}.tag:hover{border-color:rgba(125,211,168,.3);background:rgba(125,211,168,.06)}

.player-top{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:9px}.player-art-wrap{position:relative;width:48px;height:48px;flex:0 0 48px}.player-art-wrap::before{content:"";position:absolute;inset:-4px;border-radius:13px;background:linear-gradient(135deg,var(--music-accent),var(--music-accent-soft));opacity:0;filter:blur(9px);animation:breathe 2.6s ease-in-out infinite}.player.is-playing .player-art-wrap::before{opacity:.22}@keyframes breathe{0%,100%{transform:scale(.96);opacity:.18}50%{transform:scale(1.04);opacity:.32}}

.progress-row{display:flex;align-items:center;gap:7px;font-size:8.5px;color:var(--text-faint);font-weight:700}.progress-track{position:relative;flex:1;height:3px;border-radius:99px;background:rgba(255,255,255,.08);cursor:pointer}.progress-fill{position:relative;width:0%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--music-accent),var(--music-accent-soft));box-shadow:0 0 9px rgba(143,214,176,.15);transition:width .15s linear}.progress-thumb{position:absolute;top:50%;right:0;width:7px;height:7px;transform:translate(50%,-50%);border-radius:50%;background:#fff;opacity:0;transition:opacity .16s ease}.progress-track:hover .progress-thumb{opacity:1}

.playlist-panel{position:absolute;left:0;right:0;top:calc(100% + 9px);bottom:auto;display:flex;flex-direction:column;gap:3px;max-height:min(330px,52vh);overflow-y:auto;padding:7px;border:1px solid rgba(255,255,255,.09);border-radius:15px;background:linear-gradient(145deg,rgba(20,24,28,.94),rgba(8,11,14,.92));backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 18px 50px rgba(0,0,0,.36),0 1px 0 rgba(255,255,255,.05) inset;scrollbar-width:thin;scrollbar-color:rgba(125,211,168,.42) transparent;visibility:hidden;opacity:0;transform:translateY(-6px) scale(.985);transform-origin:top center;pointer-events:none;transition:opacity .2s ease,transform .22s var(--ease),visibility 0s linear .22s}.playlist-panel.open{visibility:visible;opacity:1;transform:translateY(0) scale(1);pointer-events:auto;transition-delay:0s}.playlist-panel::-webkit-scrollbar{width:4px}.playlist-panel::-webkit-scrollbar-track{background:transparent}.playlist-panel::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(143,214,176,.55),rgba(125,211,168,.28));border-radius:999px}.playlist-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 7px 7px 8px;color:var(--text-dim);font-size:9px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}.playlist-head strong{color:var(--text);font-size:9.5px}.playlist-head span:last-child{color:var(--text-faint);letter-spacing:.04em}.playlist-item{display:flex;align-items:center;gap:8px;padding:7px;border-radius:11px;cursor:pointer;color:var(--text-dim);transition:background .15s ease,color .15s ease,transform .15s ease,border-color .15s ease;border:1px solid transparent}.playlist-item:hover{background:rgba(255,255,255,.05);color:var(--text);transform:translateX(2px)}.playlist-item.active{background:rgba(125,211,168,.065);color:var(--text);border-color:rgba(143,214,176,.075)}.playlist-thumb{width:34px;height:34px;border-radius:9px;flex:0 0 34px;background:linear-gradie const Background=(()=>{const root=document.getElementById('bg'),video=document.getElementById('bgVideo'),fog=document.getElementById('bgFog'),overlay=document.getElementById('bgOverlay');if(!root)return{apply(){}};function clamp01(v){return Math.max(0,Math.min(1,Number(v)||0))}function clearVideo(){if(!video)return;try{video.pause()}catch(_){}video.removeAttribute('src');video.load();video.style.display='none'}function apply(){const cfg=BIO_CONFIG.background||{},type=cfg.type||'gradient';clearVideo();if(overlay)overlay.style.display='none';if(fog)fog.style.display='none';root.style.backgroundImage='';root.style.backgroundPosition='';root.style.backgroundSize='';root.style.backgroundRepeat='';if(cfg.enabled===false)return;if(type==='video'&&cfg.source&&video){video.src=cfg.source;video.muted=true;video.autoplay=true;video.loop=true;video.playsInline=true;video.style.objectPosition=cfg.position||'center center';video.style.objectFit=cfg.size||'cover';video.style.display='block';video.play().catch(()=>{})}else if(type==='image'&&cfg.source){const safeSource=String(cfg.source).replace(/"/g,'\\"');root.style.backgroundImage=`url("${safeSource}"),radial-gradient(820px 620px at 82% 12%,rgba(170,255,220,.105),transparent 67%),radial-gradient(700px 520px at 72% 78%,rgba(170,205,255,.055),transparent 70%),radial-gradient(520px 420px at 24% 34%,rgba(120,235,205,.035),transparent 72%),linear-gradient(135deg,#12171b 0%,#0b1014 48%,#06080b 100%)`;root.style.backgroundPosition=`${cfg.position||'center center'},center,center,center,center`;root.style.backgroundSize=`${cfg.size||'cover'},auto,auto,auto,auto`;root.style.backgroundRepeat='no-repeat,no-repeat,no-repeat,no-repeat,no-repeat';root.style.backgroundColor='#06080b'}const ov=cfg.overlay||{};if(overlay&&ov.enabled!==false&&ov.color){overlay.style.background=ov.color;overlay.style.display='block'}const fg=cfg.fog||{};if(fog&&fg.enabled){const fogBlur=Math.min(3,Math.max(0,Number(fg.blur||0)));fog.style.background=fg.color||'rgb function initCustomCursor(){if(!window.matchMedia('(pointer:fine)').matches)return;const dot=document.querySelector('.cursor-dot'),ring=document.querySelector('.cursor-ring');if(!dot||!ring)return;if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;let mx=innerWidth/2,my=innerHeight/2,rx=mx,ry=my,visible=false,raf=0;const selector=['a','button','input','select','textarea','[role="button"]','.clickable','.progress-track','.playlist-item','.volume-range','.clock-pill'].join(',');const render=()=>{rx+=(mx-rx)*.18;ry+=(my-ry)*.18;dot.style.transform=`translate3d(${mx}px,${my}px,0)`;ring.style.transform=`translate3d(${rx}px,${ry}px,0)`;raf=requestAnimationFrame(render)};const show=()=>{if(!visible){visible=true;dot.classList.remove('is-hidden');ring.classList.remove('is-hidden')}};const hide=()=>{visible=false;dot.classList.add('is-hidden');ring.classList.add('is-hidden');document.body.classList.remove('cursor-hover','cursor-click')};window.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;show()},{passive:true});window.addEventListener('mouseleave',hide,{passive:true});window.addEventListener('mouseenter',show,{passive:true});document.addEventListener('mouseover',e=>{if(e.target.closest(selector))document.body.classList.add('cursor-hover')});document.addEventListener('mouseout',e=>{if(e.target.closest(selector)&&!e.relatedTarget?.closest?.(selector))document.body.classList.remove('cursor-hover')});document.addEventListener('mousedown',e=>{if(e.button===0)document.body.classList.add('cursor-click')});window.addEventListener('mouseup',()=>document.body.classList.remove('cursor-click'),{passive:true});window.addEventListener('blur',hide,{passive:true});dot.classList.add('is-hidden');ring.classList.add('is-hidden');cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
initCustomCursor();Background.apply();renderNav();renderProfile();renderSocials();renderFooter();Player.mount();Weather.init();Discord.init();initSpotlight();requestAnimationFrame(()=>document.body.classList.add('ready'));
